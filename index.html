<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#14594a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>StockBill – Phase 3 (multi-organisation)</title>
<style>
:root{--bg:#f3f5f2;--card:#fff;--ink:#1d2a24;--mut:#66756d;--line:#d9e0db;--pri:#14594a;--pri2:#0e4337;--bad:#b3261e;--ok:#1b7a3d;--head:#e6ece8;--recv:#1b7a3d;--pay:#c2410c}
.recv{color:var(--recv)}.pay{color:var(--pay)}
*{box-sizing:border-box}
body{margin:0;font:15px/1.45 system-ui,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--pri);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
header b{font-size:17px;flex:1}header small{opacity:.85}
nav{display:flex;gap:4px;padding:8px 10px;overflow-x:auto;background:var(--head,#e6ece8)}
nav button{border:0;background:none;padding:8px 14px;border-radius:8px;font:inherit;color:var(--ink);cursor:pointer;white-space:nowrap}
nav button.on{background:var(--pri);color:#fff}
main{max-width:980px;margin:0 auto;padding:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
h2{margin:0 0 10px;font-size:18px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
label{display:block;font-size:12px;color:var(--mut);margin-bottom:2px}
input,select{width:100%;padding:9px;border:1px solid var(--line);border-radius:7px;font:inherit;background:#fff}
button.b{background:var(--pri);color:#fff;border:0;border-radius:8px;padding:9px 14px;font:inherit;cursor:pointer}
button.b:hover{background:var(--pri2)}button.s{background:#fff;color:var(--pri);border:1px solid var(--pri)}
button.d{background:#fff;color:var(--bad);border:1px solid var(--bad)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}th{color:var(--mut);font-weight:600}
.msg{padding:9px 12px;border-radius:8px;margin-bottom:10px;background:#e8f3ec;color:var(--ok)}.msg.e{background:#fbe9e7;color:var(--bad)}
.login{max-width:380px;margin:8vh auto}.mut{color:var(--mut);font-size:13px}.hide{display:none}
h3{margin:14px 0 6px;font-size:15px}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;background:#eef2ef;color:var(--mut)}
.badge.ok{background:#e8f3ec;color:var(--ok)}.badge.w{background:#fff4e0;color:#8a5a00}.badge.x{background:#fbe9e7;color:var(--bad)}
.short{color:var(--bad);font-weight:600}
.sheet .top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:8px;margin-bottom:10px}
.sheet .two{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:10px}
table.pr th,table.pr td{border:1px solid var(--ink)}
.sign{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:56px;text-align:center;font-size:13px}
.sign div{border-top:1px solid var(--ink);padding-top:4px}
@media print{header,nav,.noprint,.msg{display:none!important}body{background:#fff}main{max-width:none;padding:0}.card{border:0;padding:0;margin:0}}
.mods{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:6px}
label.chk{display:flex;align-items:center;gap:7px;font-size:14px;color:var(--ink);margin:0}
input[type=checkbox]{width:auto}
.clogo{height:30px;margin-right:8px;vertical-align:middle;border-radius:4px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:12px}
.mbox{background:#fff;border-radius:12px;padding:18px;max-width:460px;width:100%;max-height:92vh;overflow:auto}
</style></head><body>
<div id="app"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
// Firebase web config for project stockflow-d27fe
const CFG={apiKey:"AIzaSyBHPncMFGpHJx85bhcKhH94hVexld40A-g",authDomain:"stockflow-d27fe.firebaseapp.com",projectId:"stockflow-d27fe",storageBucket:"stockflow-d27fe.firebasestorage.app",messagingSenderId:"420455056832",appId:"1:420455056832:web:d32dce871120c9f9653425"};

firebase.initializeApp(CFG);
const auth=firebase.auth(),db=firebase.firestore();
const ROLES={admin:"Admin",manager:"Warehouse manager",keeper:"Warehouse keeper",billdesk:"Bill desk",super:"Platform owner"};
const ORG_ROLES=["admin","manager","keeper","billdesk"];

/* ---------- MODULE CATALOGUE (what an organisation can buy) ----------
   requires = modules that must also be on. soon = no screens yet.
   Firestore rules enforce the module flags, so switching one off really blocks it. */
const MODS={
  warehouse:{label:"Warehouse",desc:"Warehouse master",requires:[],dflt:true},
  inventory:{label:"Inventory",desc:"Items, Excel upload, product compositions, stock ledger",requires:["warehouse"],dflt:true},
  sales:{label:"Sales (challans)",desc:"Delivery challans, returns, manager verification",requires:["inventory"]},
  billing:{label:"Billing",desc:"GST bills from challans, payments, UPI/NEFT details",requires:["sales"]},
  purchase:{label:"Purchase",desc:"Purchase orders and goods receipts into warehouses",requires:["inventory"]},
  reports:{label:"Reports & dashboards",desc:"Sales, receivables, stock value, exceptions, CSV download",requires:[]}
};
const reqAll=(k,s=new Set())=>{if(s.has(k))return s;s.add(k);MODS[k].requires.forEach(r=>reqAll(r,s));return s};            // k + everything it needs
const depsOf=(k,s=new Set())=>{if(s.has(k))return s;s.add(k);Object.keys(MODS).filter(x=>MODS[x].requires.includes(k)).forEach(x=>depsOf(x,s));return s}; // k + everything needing it
const fullMods=picked=>{const on=new Set();picked.forEach(k=>reqAll(k).forEach(x=>on.add(x)));const m={};Object.keys(MODS).forEach(k=>m[k]=on.has(k));return m};

let me=null,tab="items",busy=false,items=[],whs=[],users=[],stock=[],note="",editing=null,products=[],challans=[],company={};
let orgId=null,org=null,orgsList=[];
const $=s=>document.querySelector(s);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const O=n=>db.collection("orgs/"+orgId+"/"+n);      // this organisation's collection
const D=p=>db.doc("orgs/"+orgId+"/"+p);             // this organisation's document
const has=m=>!!(org&&org.modules&&org.modules[m]);
const orgOK=()=>org&&org.active!==false&&(!org.validUntil||Date.now()<=org.validUntil);
const canEdit=()=>me&&(me.role==="admin"||me.role==="manager");
/* ---------- AUDIT LOG: who changed what (append-only, see rules) ---------- */
const auditRec=(action,entity,ref,detail)=>({action,entity,ref:String(ref??""),detail:String(detail??"").slice(0,300),by:me?me.name:"",uid:me?me.uid:"",at:Date.now()});
const auditTo=(oid,action,entity,ref,detail)=>db.collection("orgs/"+oid+"/audit").add(auditRec(action,entity,ref,detail)).catch(e=>console.warn("audit write failed",e));
const audit=(action,entity,ref,detail)=>auditTo(orgId,action,entity,ref,detail);
const isAdmin=()=>me&&me.role==="admin";
function say(t,e){note=`<div class="msg ${e?"e":""}">${esc(t)}</div>`;if(!e&&!viewing&&!viewingBill&&!viewingPO)clearFm(tab);draw()}
function err(e){say(e.message||String(e),true)}
const resetData=()=>{items=[];whs=[];stock=[];products=[];challans=[];company={};users=[];auditRows=[];bills=[];bd=null;viewingBill=null;purchases=[];pu=null;viewingPO=null;offers=[]};

auth.onAuthStateChanged(async u=>{
  if(busy)return;
  if(!u){me=null;orgId=null;org=null;return loginView()}
  try{await boot(u)}catch(e){loginView(e.message,true)}
});

async function boot(u){
  resetData();
  const sp=await db.doc("platform/"+u.uid).get();
  if(sp.exists){me={uid:u.uid,...sp.data(),super:true,role:"super"};orgId=null;org=null;tab="orgs";await loadOrgs();return draw()}
  const uo=await db.doc("userOrg/"+u.uid).get();
  if(!uo.exists){
    let legacy=null,claimed=true;
    try{const l=await db.doc("users/"+u.uid).get();legacy=l.exists?l.data():null;claimed=(await db.doc("meta/platform").get()).exists}catch(e){}
    me=null;
    if(legacy&&legacy.role==="admin"&&!claimed)return claimView(legacy);
    return loginView("This account is not linked to an organisation. Ask your vendor or admin.",true);
  }
  orgId=uo.data().orgId;
  const [od,ud]=await Promise.all([db.doc("orgs/"+orgId).get(),D("users/"+u.uid).get()]);
  if(!od.exists||!ud.exists){me=null;return loginView("Your access has been removed.",true)}
  org={id:orgId,...od.data()};
  if(!orgOK()){me=null;return loginView("This organisation's subscription is inactive or expired. Please contact your vendor.",true)}
  me={uid:u.uid,...ud.data(),super:false};
  tab="";await loadAll();draw();
}

async function loginView(m,bad){
  let first=false;
  try{first=!(await db.doc("meta/platform").get()).exists&&!(await db.doc("meta/setup").get()).exists}catch(e){}
  $("#app").innerHTML=`<div class="login card"><h2>StockBill</h2>
  ${m?`<div class="msg ${bad?"e":""}">${esc(m)}</div>`:""}
  ${first?`<div class="field"><label>Your name (first-time setup only)</label><input id="nm"></div>`:""}
  <label>Email</label><input id="em" type="email"><label style="margin-top:8px">Password</label><input id="pw" type="password">
  <div class="row"><button class="b" onclick="login()">Log in</button>
  ${first?`<button class="b s" onclick="setup()">Create platform owner</button>`:""}
  ${auth.currentUser?`<button class="b s" onclick="auth.signOut()">Log out</button>`:""}</div>
  ${first?`<p class="mut">Fresh install: this first account becomes the platform owner who creates organisations and switches modules on or off.</p>`:""}</div>`;
}
function claimView(l){
  $("#app").innerHTML=`<div class="login card"><h2>Upgrade to multi-organisation</h2>
  <p>You are the original admin of the single-company version. Make this account the <b>platform owner</b> to create organisations (customers) and control which modules each one has.</p>
  <div class="row"><button class="b" onclick="claim()">Make me platform owner</button><button class="b s" onclick="auth.signOut()">Log out</button></div></div>`;
}
window.claim=async()=>{
  const u=auth.currentUser;
  try{
    const b=db.batch();
    b.set(db.doc("platform/"+u.uid),{name:u.displayName||u.email,email:u.email});
    b.set(db.doc("meta/platform"),{by:u.uid,at:Date.now()});
    await b.commit();await boot(u);
  }catch(e){loginView(e.message,true)}
};
window.login=()=>auth.signInWithEmailAndPassword($("#em").value.trim(),$("#pw").value).catch(e=>loginView(e.message,true));
window.setup=async()=>{
  const em=$("#em").value.trim(),pw=$("#pw").value,nm=$("#nm").value.trim()||"Owner";
  try{
    busy=true;
    const c=await auth.createUserWithEmailAndPassword(em,pw);
    const b=db.batch();
    b.set(db.doc("platform/"+c.user.uid),{name:nm,email:em});
    b.set(db.doc("meta/setup"),{by:c.user.uid,at:Date.now()});
    b.set(db.doc("meta/platform"),{by:c.user.uid,at:Date.now()});
    await b.commit();
    busy=false;await boot(c.user);
  }catch(e){busy=false;loginView(e.message,true)}
};

async function loadAll(){
  const od=await db.doc("orgs/"+orgId).get();org={id:orgId,...od.data()};
  resetData();const P=[];
  if(has("inventory"))P.push((async()=>{
    const [i,st,pr]=await Promise.all([O("items").orderBy("code").get(),O("stock").get(),O("products").orderBy("code").get()]);
    items=i.docs.map(d=>({id:d.id,...d.data()}));stock=st.docs.map(d=>d.data()).sort((a,b)=>b.at-a.at);products=pr.docs.map(d=>({id:d.id,...d.data()}));
  })());
  if(has("warehouse"))P.push((async()=>{const w=await O("warehouses").orderBy("name").get();whs=w.docs.map(d=>({id:d.id,...d.data()}))})());
  if(has("sales"))P.push((async()=>{const c=await O("challans").orderBy("at","desc").limit(300).get();challans=c.docs.map(d=>({id:d.id,...d.data()}))})());
  if(has("billing"))P.push((async()=>{const b=await O("bills").orderBy("at","desc").limit(300).get();bills=b.docs.map(d=>({id:d.id,...d.data()}))})());
  if(has("billing"))P.push((async()=>{const s=await O("offers").get();offers=s.docs.map(d=>({id:d.id,...d.data()}))})());
  if(has("purchase"))P.push((async()=>{const p=await O("purchases").orderBy("at","desc").limit(300).get();purchases=p.docs.map(d=>({id:d.id,...d.data()}))})());
  P.push((async()=>{const co=await D("settings/company").get();company=co.exists?co.data():{}})());
  if(isAdmin())P.push((async()=>{const u=await O("users").get();users=u.docs.map(d=>({id:d.id,...d.data()}))})());
  await Promise.all(P);
}

function tabsFor(){
  if(!orgId)return [{k:"orgs",l:"Organisations",on:true}];
  const t=[["items","Items","inventory"],["whs","Warehouses","warehouse"],["stock","Stock","inventory"],["products","Products","inventory"],["challans","Challans","sales"],["bills","Bills","billing"],["offers","Offers","billing"],["purchases","Purchase","purchase"],["reports","Reports","reports"]]
    .map(([k,l,m])=>({k,l,on:has(m)&&(k!=="reports"||canEdit())}));
  if(isAdmin())t.push({k:"users",l:"Users",on:true},{k:"audit",l:"Audit log",on:true},{k:"company",l:"Company & plan",on:true});
  return t;
}
window.goTab=k=>{tab=k;note="";editing=null;calc=null;viewing=null;viewingBill=null;viewingPO=null;restorePending=true;if(k==="audit"){loadAudit().then(draw);return}draw()};
function draw(){
  syncDrafts();applyLook();
  const ts=tabsFor();
  if(!ts.some(t=>t.k===tab&&t.on))tab=(ts.find(t=>t.on)||{k:""}).k;
  const views={items:itemsView,whs:whView,stock:stockView,products:productsView,challans:challansView,users:usersView,audit:auditView,bills:billsView,offers:offersView,purchases:purchasesView,reports:reportsView,company:companyView,orgs:orgsView};
  $("#app").innerHTML=`<header>${(company||{}).logo?`<img class="clogo" src="${company.logo}" alt="">`:""}<b>${esc((company||{}).name||"StockBill")}</b><small>${org?esc(org.name)+" · ":""}${esc(me.name)} · ${ROLES[me.role]}</small>
  ${me.super&&orgId?`<button class="b s" onclick="leaveOrg()">← Platform</button>`:""}
  <button class="b s" onclick="auth.signOut()">Log out</button></header>
  <nav>${ts.map(t=>t.on?`<button class="${tab===t.k?"on":""}" onclick="goTab('${t.k}')">${t.l}</button>`
    :`<button style="opacity:.55" onclick="say('${t.l} is not part of your plan. Contact your vendor to enable it.',true)">🔒 ${t.l}</button>`).join("")}</nav>
  <main>${note}${tab&&views[tab]?views[tab]():`<div class="card">No modules are enabled for this organisation yet. Please contact your vendor.</div>`}</main>`;
  persistDrafts();
  if(restorePending){restorePending=false;restoreFm()}
}

/* ---------- ITEMS ---------- */
function itemsView(){
  const e=editing?items.find(x=>x.id===editing):{};
  const form=canEdit()?`<div class="card"><h2>${editing?"Edit item":"Add item"}</h2>
  <div class="g">
  <div><label>Item code</label><input id="ic" value="${esc(e.code)}" ${editing?"disabled":""}></div>
  <div><label>Item name</label><input id="in" value="${esc(e.name)}"></div>
  <div><label>Unit (pcs, kg…)</label><input id="iu" value="${esc(e.unit)}"></div>
  <div><label>HSN code</label><input id="ih" value="${esc(e.hsn)}"></div>
  <div><label>GST %</label><input id="ig" type="number" value="${esc(e.gst)}"></div>
  <div><label>Rate (₹)</label><input id="ir" type="number" value="${esc(e.rate)}"></div></div>
  <div class="row"><button class="b" onclick="saveItem()">Save item</button>${editing?`<button class="b s" onclick="editing=null;draw()">Cancel</button>`:""}</div></div>
  <div class="card"><h2>Upload from Excel</h2>
  <p class="mut">Download the template, fill it, and upload. Rows with an existing code update that item.</p>
  <div class="row"><button class="b s" onclick="tpl()">Download Excel template</button>
  <input type="file" id="xf" accept=".xlsx,.xls,.csv" style="max-width:260px"><button class="b" onclick="upl()">Upload</button></div></div>`:"";
  return form+`<div class="card"><h2>Items (${items.length})</h2><div class="tw"><table>
  <tr><th>Code</th><th>Name</th><th>Unit</th><th>HSN</th><th>GST%</th><th>Rate</th>${canEdit()?"<th></th>":""}</tr>
  ${items.map(i=>`<tr><td>${esc(i.code)}</td><td>${esc(i.name)}</td><td>${esc(i.unit)}</td><td>${esc(i.hsn)}</td><td>${esc(i.gst)}</td><td>${esc(i.rate)}</td>
  ${canEdit()?`<td><button class="b s" onclick="editing='${esc(i.id)}';draw()">Edit</button> <button class="b d" onclick="delItem('${esc(i.id)}')">Delete</button></td>`:""}</tr>`).join("")||`<tr><td colspan="7">No items yet. Add one or upload an Excel file.</td></tr>`}
  </table></div></div>`;
}
const iid=c=>String(c).trim().toUpperCase().replace(/[\/\s]+/g,"-");
window.saveItem=async()=>{
  const code=($("#ic").value||"").trim(),name=$("#in").value.trim();
  if(!code||!name)return say("Item code and name are required.",true);
  const d={code,name,unit:$("#iu").value.trim()||"pcs",hsn:$("#ih").value.trim(),gst:Number($("#ig").value)||0,rate:Number($("#ir").value)||0};
  try{await D("items/"+iid(code)).set(d,{merge:true});await audit("Saved","Item",iid(code),name+" · rate "+d.rate+" · GST "+d.gst+"%");editing=null;await loadAll();say("Item saved.")}catch(e){err(e)}
};
window.delItem=async id=>{
  const used=stock.some(s=>s.item===id)||products.some(p=>(p.lines||[]).some(l=>l.item===id));
  let ex=null;
  if(used){
    ex=await askException("Delete item that has history",`${id} is still used by stock or products. Those records stay and show the item code.`);
    if(!ex)return;
  }
  if(!confirm("Delete this item?"))return;
  try{await D("items/"+id).delete();await audit(ex?"Exception delete":"Deleted","Item",id,ex?ex.reason+" (approved by "+ex.approver+")":"");await loadAll();say("Item deleted.")}catch(e){err(e)}
};
window.tpl=()=>{
  const ws=XLSX.utils.aoa_to_sheet([["Code","Name","Unit","HSN","GST%","Rate"],["ITM001","Sample item","pcs","1905",18,100]]);
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"Items");XLSX.writeFile(wb,"items_template.xlsx");
};
window.upl=async()=>{
  const f=$("#xf").files[0];if(!f)return say("Choose a file first.",true);
  try{
    const wb=XLSX.read(await f.arrayBuffer());
    const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:""});
    const ok=[],bad=[];
    rows.forEach((r,n)=>{
      const code=String(r.Code||"").trim(),name=String(r.Name||"").trim();
      if(!code||!name)return bad.push(n+2);
      ok.push({code,name,unit:String(r.Unit||"pcs"),hsn:String(r.HSN||""),gst:Number(r["GST%"])||0,rate:Number(r.Rate)||0});
    });
    for(let i=0;i<ok.length;i+=400){
      const b=db.batch();ok.slice(i,i+400).forEach(d=>b.set(D("items/"+iid(d.code)),d,{merge:true}));await b.commit();
    }
    await audit("Uploaded","Item",f.name,ok.length+" items");await loadAll();say(`${ok.length} items saved.${bad.length?` Skipped rows (missing code or name): ${bad.join(", ")}.`:""}`,bad.length>0&&!ok.length);
  }catch(e){err(e)}
};

/* ---------- WAREHOUSES ---------- */
function whView(){
  return (canEdit()?`<div class="card"><h2>Add warehouse</h2><div class="g">
  <div><label>Name</label><input id="wn"></div><div><label>Location</label><input id="wl"></div>
  <div><label>Incharge</label><input id="wi"></div></div>
  <div class="row"><button class="b" onclick="addWh()">Save warehouse</button></div></div>`:"")+
  `<div class="card"><h2>Warehouses (${whs.length})</h2><div class="tw"><table><tr><th>Name</th><th>Location</th><th>Incharge</th>${canEdit()?"<th></th>":""}</tr>
  ${whs.map(w=>`<tr><td>${esc(w.name)}</td><td>${esc(w.location)}</td><td>${esc(w.incharge)}</td>${canEdit()?`<td><button class="b d" onclick="delWh('${esc(w.id)}')">Delete</button></td>`:""}</tr>`).join("")||`<tr><td colspan="4">No warehouses yet. Add your first one above.</td></tr>`}
  </table></div></div>`;
}
window.addWh=async()=>{
  const name=$("#wn").value.trim();if(!name)return say("Warehouse name is required.",true);
  try{await O("warehouses").add({name,location:$("#wl").value.trim(),incharge:$("#wi").value.trim()});await audit("Created","Warehouse",name,"");await loadAll();say("Warehouse saved.")}catch(e){err(e)}
};
window.delWh=async id=>{
  const used=stock.some(s=>s.wh===id)||challans.some(c=>c.wh===id);
  let ex=null;
  if(used){
    ex=await askException("Delete warehouse that has history",`${wName(id)} still has stock or challans. Those records stay.`);
    if(!ex)return;
  }
  if(!confirm("Delete this warehouse?"))return;
  try{await D("warehouses/"+id).delete();await audit(ex?"Exception delete":"Deleted","Warehouse",wName(id),ex?ex.reason+" (approved by "+ex.approver+")":"");await loadAll();say("Warehouse deleted.")}catch(e){err(e)}
};

/* ---------- STOCK LEDGER ---------- */
const MT={in:"Stock in",out:"Stock out",return:"Returned",damage:"Damaged"};
const iItemLabel=id=>(items.find(x=>x.id===id)||{}).code||id;
const wName=id=>(whs.find(w=>w.id===id)||{}).name||id, iName=id=>(items.find(x=>x.id===id)||{}).name||id;
function balances(){const m={};stock.forEach(s=>{const k=s.wh+"|"+s.item,o=m[k]||(m[k]={in:0,out:0,return:0,damage:0});o[s.type]+=s.qty});return m}
const avail=o=>o?o.in+o.return-o.out-o.damage:0;
function stockView(){
  const b=balances(),canPost=me.role!=="billdesk";
  const opt=(a,f)=>a.map(x=>`<option value="${esc(x.id)}">${esc(f(x))}</option>`).join("");
  return (canPost?`<div class="card"><h2>Record stock movement</h2><div class="g">
  <div><label>Warehouse</label><select id="sw">${opt(whs,w=>w.name)}</select></div>
  <div><label>Item</label><select id="si">${opt(items,x=>x.code+" – "+x.name)}</select></div>
  <div><label>Movement</label><select id="st">${Object.entries(MT).map(t=>`<option value="${t[0]}">${t[1]}</option>`).join("")}</select></div>
  <div><label>Quantity</label><input id="sq" type="number" min="0"></div>
  <div><label>Reference (invoice, challan…)</label><input id="sr"></div></div>
  <div class="row"><button class="b" onclick="addMove()">Save movement</button></div></div>`:"")+
  `<div class="card"><h2>Stock by warehouse</h2><div class="tw"><table><tr><th>Warehouse</th><th>Item</th><th>In</th><th>Out</th><th>Returned</th><th>Damaged</th><th>Available</th></tr>
  ${Object.entries(b).map(([k,o])=>{const[w,i]=k.split("|");return`<tr><td>${esc(wName(w))}</td><td>${esc(iName(i))}</td><td>${o.in}</td><td>${o.out}</td><td>${o.return}</td><td>${o.damage}</td><td><b>${avail(o)}</b></td></tr>`}).join("")||`<tr><td colspan="7">No stock yet. Record a “Stock in” movement above.</td></tr>`}</table></div></div>
  <div class="card"><h2>Recent movements</h2><div class="tw"><table><tr><th>Date</th><th>Warehouse</th><th>Item</th><th>Type</th><th>Qty</th><th>Ref</th><th>By</th></tr>
  ${stock.slice(0,20).map(s=>`<tr><td>${new Date(s.at).toLocaleString()}</td><td>${esc(wName(s.wh))}</td><td>${esc(iName(s.item))}</td><td>${MT[s.type]}</td><td>${s.qty}</td><td>${esc(s.ref)}</td><td>${esc(s.by)}</td></tr>`).join("")||`<tr><td colspan="7">No movements yet.</td></tr>`}</table></div></div>`;
}
window.addMove=async()=>{
  const wh=$("#sw").value,item=$("#si").value,type=$("#st").value,qty=Number($("#sq").value);
  if(!wh||!item)return say("Add a warehouse and an item first.",true);
  if(!(qty>0))return say("Enter a quantity above zero.",true);
  const have=avail(balances()[wh+"|"+item]);
  let ex=null;
  if((type==="out"||type==="damage")&&qty>have){
    ex=await askException("Stock out beyond availability",`${iItemLabel(item)} in ${wName(wh)}: taking ${qty}, only ${have} available`);
    if(!ex)return;
  }
  try{const ref=$("#sr").value.trim();await O("stock").add({wh,item,type,qty,ref,by:me.name,at:Date.now(),exception:ex});await audit(ex?"Exception stock "+type:"Stock "+type,"Stock",iItemLabel(item),wName(wh)+" · qty "+qty+(ref?" · "+ref:"")+(ex?" · "+ex.reason:""));await loadAll();say("Movement saved.")}catch(e){err(e)}
};

/* ---------- USERS (organisation admin) ---------- */
function usersView(){

window.setRole=async(id,role)=>{

/* ================= PHASE 3 ================= */
const rnd=n=>Math.round(n*1000)/1000;
const today=()=>new Date().toISOString().slice(0,10);
const dfmt=s=>{const p=String(s||"").split("-");return p.length===3?p[2]+"/"+p[1]+"/"+p[0]:(s||"")};
const opts=(a,f,sel)=>a.map(x=>`<option value="${esc(x.id)}" ${x.id===sel?"selected":""}>${esc(f(x))}</option>`).join("");
const gv=id=>{const e=$("#"+id);return e?e.value:""};
// components of a challan line for quantity q (products explode into their items)
const comps=(l,q)=>l.kind==="product"?(l.comp||[]).map(c=>[c.item,rnd(c.qty*q)]):[[l.ref,q]];
function needOf(lines,key){key=key||"out";const m={};lines.forEach(l=>comps(l,l[key]).forEach(([i,n])=>m[i]=rnd((m[i]||0)+n)));return m}
const pend=l=>rnd(l.out-(l.billed||0)-(l.returned||0));
const canCreateCh=()=>me&&["admin","manager","keeper"].includes(me.role);
const canBill=()=>me&&["admin","manager","billdesk"].includes(me.role);
const compText=ls=>(ls||[]).map(c=>`${c.qty} × ${iName(c.item)}`).join(", ");

/* ---------- PRODUCTS (compositions) ---------- */
let pd=null,calc=null;
const pdNew=()=>({code:"",name:"",unit:"set",lines:[]});
function pdSync(){if(!pd)return;pd.code=gv("pc");pd.name=gv("pn");pd.unit=gv("pu")}
function productsView(){
  let form="";
  if(canEdit()){
    pd=pd||pdNew();
    form=`<div class="card"><h2>${pd.id?"Edit product":"New product"}</h2><div class="g">
    <div><label>Product code</label><input id="pc" value="${esc(pd.code)}" ${pd.id?"disabled":""}></div>
    <div><label>Product name</label><input id="pn" value="${esc(pd.name)}"></div>
    <div><label>Unit</label><input id="pu" value="${esc(pd.unit)}"></div></div>
    <h3>Composition (items in one product)</h3>
    <div class="g"><div><label>Item</label><select id="pi">${opts(items,x=>x.code+" – "+x.name)}</select></div>
    <div><label>Qty per product</label><input id="pq" type="number" min="0" step="any"></div>
    <div style="align-self:end"><button class="b s" onclick="pdAdd()">Add to composition</button></div></div>
    <div class="tw"><table><tr><th>Item</th><th>Qty</th><th></th></tr>
    ${pd.lines.map((l,i)=>`<tr><td>${esc(iName(l.item))}</td><td>${l.qty}</td><td><button class="b d" onclick="pdDel(${i})">Remove</button></td></tr>`).join("")||`<tr><td colspan="3">No items yet.</td></tr>`}</table></div>
    <div class="row"><button class="b" onclick="saveProduct()">Save product</button>${pd.id?`<button class="b s" onclick="pd=null;draw()">Cancel</button>`:""}</div></div>`;
  }
  const calcCard=products.length&&whs.length?`<div class="card"><h2>Check requirement (product → items)</h2><div class="g">
  <div><label>Warehouse</label><select id="kw">${opts(whs,w=>w.name,calc&&calc.wh)}</select></div>
  <div><label>Product</label><select id="kp">${opts(products,p=>p.code+" – "+p.name,calc&&calc.p)}</select></div>
  <div><label>Quantity</label><input id="kq" type="number" min="0" step="any" value="${calc?calc.q:1}"></div></div>
  <div class="row"><button class="b s" onclick="runCalc()">Check</button></div>${calc?calcOut():""}</div>`:"";
  return form+`<div class="card"><h2>Products (${products.length})</h2><div class="tw"><table><tr><th>Code</th><th>Name</th><th>Unit</th><th>Composition</th>${canEdit()?"<th></th>":""}</tr>
  ${products.map(p=>`<tr><td>${esc(p.code)}</td><td>${esc(p.name)}</td><td>${esc(p.unit)}</td><td style="white-space:normal">${esc(compText(p.lines))}</td>
  ${canEdit()?`<td><button class="b s" onclick="editProduct('${esc(p.id)}')">Edit</button> <button class="b d" onclick="delProduct('${esc(p.id)}')">Delete</button></td>`:""}</tr>`).join("")||`<tr><td colspan="5">No products yet. Define one above (items needed to make one product).</td></tr>`}
  </table></div></div>`+calcCard;
}
window.pdAdd=()=>{
  pdSync();const item=gv("pi"),qty=Number(gv("pq"));
  if(!item)return say("Add items first (Items tab).",true);
  if(!(qty>0))return say("Enter a quantity above zero.",true);
  const ex=pd.lines.find(l=>l.item===item);if(ex)ex.qty=qty;else pd.lines.push({item,qty});draw();
};
window.pdDel=i=>{pdSync();pd.lines.splice(i,1);draw()};
window.editProduct=id=>{const p=products.find(x=>x.id===id);pd={id,code:p.code,name:p.name,unit:p.unit||"set",lines:p.lines.map(l=>({...l}))};draw();window.scrollTo(0,0)};
window.saveProduct=async()=>{
  pdSync();const code=pd.code.trim(),name=pd.name.trim();
  if(!code||!name)return say("Product code and name are required.",true);
  if(!pd.lines.length)return say("Add at least one item to the composition.",true);
  try{
    await D("products/"+iid(code)).set({code,name,unit:pd.unit.trim()||"set",lines:pd.lines,by:me.name,at:Date.now()});
    await audit("Saved","Product",iid(code),name+" · "+pd.lines.length+" lines");pd=null;await loadAll();say("Product saved. Existing challans keep the composition they were created with.");
  }catch(e){err(e)}
};
window.delProduct=async id=>{if(!confirm("Delete this product? Existing challans are not affected."))return;try{await D("products/"+id).delete();await audit("Deleted","Product",id,"");await loadAll();say("Product deleted.")}catch(e){err(e)}};
window.runCalc=()=>{calc={wh:gv("kw"),p:gv("kp"),q:Number(gv("kq"))||0};draw()};
function calcOut(){
  const p=products.find(x=>x.id===calc.p);if(!p||!calc.wh)return"";
  const b=balances();let can=Infinity;
  const rows=p.lines.map(c=>{const have=avail(b[calc.wh+"|"+c.item]),nd=rnd(c.qty*calc.q),sh=Math.max(0,rnd(nd-have));can=Math.min(can,Math.floor(have/c.qty));
    return`<tr><td>${esc(iName(c.item))}</td><td>${c.qty}</td><td>${nd}</td><td>${have}</td><td class="${sh?"short":""}">${sh||"–"}</td></tr>`}).join("");
  return`<p style="margin:10px 0 4px"><b>${esc(wName(calc.wh))}</b> can make <b>${can===Infinity?0:can}</b> × ${esc(p.name)} from current stock.</p>
  <div class="tw"><table><tr><th>Item</th><th>Per product</th><th>Needed</th><th>Available</th><th>Short</th></tr>${rows}</table></div>`;
}

/* ---------- CHALLANS ---------- */
let cd=null,cf={q:"",st:""},viewing=null;
const ST={dispatched:["Awaiting verification","w"],verified:["Verified","ok"],cancelled:["Cancelled","x"]};
const badge=s=>`<span class="badge ${ST[s][1]}">${ST[s][0]}</span>`;
const cdNew=()=>({wh:(whs[0]||{}).id||"",date:today(),party:"",addr:"",gstin:"",phone:"",vehicle:"",note:"",kind:"item",lines:[]});
function cdSync(){if(!cd)return;cd.wh=gv("cw");cd.date=gv("cdt");cd.party=gv("cp");cd.addr=gv("ca");cd.gstin=gv("cg");cd.phone=gv("cph");cd.vehicle=gv("cv");cd.note=gv("cn");cd.kind=gv("ck")||cd.kind}
function challansView(){
  if(viewing)return challanDetail();
  let form="";
  if(canCreateCh()){
    if(!cd)form=`<div class="card"><div class="row" style="margin:0"><button class="b" onclick="cd=cdNew();draw()">+ New challan</button></div></div>`;
    else{
      const nd=needOf(cd.lines),b=balances();
      const short=Object.entries(nd).map(([i,n])=>[i,n,avail(b[cd.wh+"|"+i])]);
      form=`<div class="card"><h2>New delivery challan</h2><div class="g">
      <div><label>Dispatch from warehouse</label><select id="cw">${opts(whs,w=>w.name,cd.wh)}</select></div>
      <div><label>Date</label><input id="cdt" type="date" value="${esc(cd.date)}"></div>
      <div><label>Party / customer</label><input id="cp" list="pl" value="${esc(cd.party)}"><datalist id="pl">${[...new Set(challans.map(c=>c.party))].map(p=>`<option value="${esc(p)}">`).join("")}</datalist></div>
      <div><label>Party GSTIN</label><input id="cg" value="${esc(cd.gstin)}"></div>
      <div><label>Phone</label><input id="cph" value="${esc(cd.phone)}"></div>
      <div><label>Vehicle / transporter</label><input id="cv" value="${esc(cd.vehicle)}"></div></div>
      <div style="margin-top:8px"><label>Delivery address</label><input id="ca" value="${esc(cd.addr)}"></div>
      <div style="margin-top:8px"><label>Note</label><input id="cn" value="${esc(cd.note)}"></div>
      <h3>Lines</h3><div class="g">
      <div><label>Type</label><select id="ck" onchange="cdSync();draw()"><option value="item" ${cd.kind==="item"?"selected":""}>Item</option><option value="product" ${cd.kind==="product"?"selected":""}>Product (composition)</option></select></div>
      <div><label>${cd.kind==="product"?"Product":"Item"}</label><select id="cr">${cd.kind==="product"?opts(products,p=>p.code+" – "+p.name):opts(items,x=>x.code+" – "+x.name)}</select></div>
      <div><label>Quantity</label><input id="cq" type="number" min="0" step="any"></div>
      <div style="align-self:end"><button class="b s" onclick="cdAdd()">Add line</button></div></div>
      <div class="tw"><table><tr><th>Description</th><th>Unit</th><th>Qty out</th><th></th></tr>
      ${cd.lines.map((l,i)=>`<tr><td>${esc(l.code+" – "+l.name)}${l.kind==="product"?`<div class="mut" style="white-space:normal">${esc(compText(l.comp))}</div>`:""}</td><td>${esc(l.unit)}</td><td>${l.out}</td><td><button class="b d" onclick="cdDel(${i})">Remove</button></td></tr>`).join("")||`<tr><td colspan="4">No lines yet.</td></tr>`}</table></div>
      ${short.length?`<h3>Stock check at ${esc(wName(cd.wh))}</h3><div class="tw"><table><tr><th>Item</th><th>Needed</th><th>Available</th><th></th></tr>
      ${short.map(([i,n,h])=>`<tr><td>${esc(iName(i))}</td><td>${n}</td><td>${h}</td><td class="${n>h?"short":""}">${n>h?"Short by "+rnd(n-h):"OK"}</td></tr>`).join("")}</table></div>`:""}
      <div class="row"><button class="b" onclick="createChallan()">Create challan &amp; deduct stock</button><button class="b s" onclick="discardDraft('challans')">Discard</button></div></div>`;
    }
  }
  const q=cf.q.toLowerCase();
  const list=challans.filter(c=>(!cf.st||c.status===cf.st)&&(!q||(c.no+" "+c.party).toLowerCase().includes(q)));
  return form+`<div class="card"><h2>Challans (${list.length})</h2>
  <div class="g" style="margin-bottom:8px"><div><label>Search number / party</label><input value="${esc(cf.q)}" onchange="cf.q=this.value;draw()"></div>
  <div><label>Status</label><select onchange="cf.st=this.value;draw()"><option value="">All</option>${Object.entries(ST).map(([k,v])=>`<option value="${k}" ${cf.st===k?"selected":""}>${v[0]}</option>`).join("")}</select></div></div>
  <div class="tw"><table><tr><th>No.</th><th>Date</th><th>Party</th><th>Warehouse</th><th>Status</th><th>Out</th><th>Billed</th><th>Returned</th><th>Pending</th><th></th></tr>
  ${list.map(c=>{const s=k=>rnd(c.lines.reduce((a,l)=>a+(l[k]||0),0));return`<tr><td><b>${esc(c.no)}</b></td><td>${dfmt(c.date)}</td><td>${esc(c.party)}</td><td>${esc(c.whName||wName(c.wh))}</td><td>${badge(c.status)}</td><td>${s("out")}</td><td>${s("billed")}</td><td>${s("returned")}</td><td>${c.status==="cancelled"?"–":rnd(c.lines.reduce((a,l)=>a+pend(l),0))}</td><td><button class="b s" onclick="viewing='${esc(c.id)}';draw();window.scrollTo(0,0)">Open</button></td></tr>`}).join("")||`<tr><td colspan="10">No challans found.</td></tr>`}</table></div></div>`;
}
window.cdAdd=()=>{
  cdSync();const kind=cd.kind,ref=gv("cr"),qty=Number(gv("cq"));
  if(!ref)return say(kind==="product"?"Define a product first (Products tab).":"Add items first (Items tab).",true);
  if(!(qty>0))return say("Enter a quantity above zero.",true);
  const ex=cd.lines.find(l=>l.kind===kind&&l.ref===ref);
  if(ex)ex.out=rnd(ex.out+qty);
  else if(kind==="product"){const p=products.find(x=>x.id===ref);cd.lines.push({kind,ref,code:p.code,name:p.name,unit:p.unit||"set",out:qty,billed:0,returned:0,comp:p.lines.map(c=>({item:c.item,qty:c.qty}))})}
  else{const i=items.find(x=>x.id===ref);cd.lines.push({kind,ref,code:i.code,name:i.name,unit:i.unit||"pcs",out:qty,billed:0,returned:0})}
  draw();
};
window.cdDel=i=>{cdSync();cd.lines.splice(i,1);draw()};
const stockDoc=(wh,item,type,qty,ref,cid,ex)=>({wh,item,type,qty,ref,challan:cid,by:me.name,at:Date.now(),exception:ex||null});
window.createChallan=async()=>{
  cdSync();
  if(!cd.wh)return say("Choose a warehouse.",true);
  if(!cd.party.trim())return say("Enter the party name.",true);
  if(!cd.lines.length)return say("Add at least one line.",true);
  try{
    await loadAll();
    const nd=needOf(cd.lines),b=balances();
    const shorts=Object.entries(nd).map(([i,n])=>({i,n,h:avail(b[cd.wh+"|"+i])})).filter(x=>x.n>x.h);
    const shortSet=new Set(shorts.map(x=>x.i));
    let ex=null;
    if(shorts.length){
      ex=await askException("Dispatch with short stock",shorts.map(x=>`${iName(x.i)}: need ${x.n}, have ${x.h} in ${wName(cd.wh)}`).join("; "));
      if(!ex)return;
    }
    const ref=O("challans").doc(),cref=D("counters/main"),at=Date.now();
    let no;
    await db.runTransaction(async t=>{
      const cs=await t.get(cref),n=(cs.exists&&cs.data().challan||0)+1;
      no="CH-"+String(n).padStart(4,"0");
      t.set(cref,{challan:n},{merge:true});
      t.set(ref,{no,wh:cd.wh,whName:wName(cd.wh),date:cd.date||today(),party:cd.party.trim(),addr:cd.addr.trim(),gstin:cd.gstin.trim(),phone:cd.phone.trim(),vehicle:cd.vehicle.trim(),note:cd.note.trim(),
        lines:cd.lines,exception:ex,status:"dispatched",createdBy:me.name,createdUid:me.uid,at,log:[{t:"Created and dispatched",by:me.name,at}]});
      Object.entries(nd).forEach(([i,n2])=>t.set(O("stock").doc(),stockDoc(cd.wh,i,"out",n2,no,ref.id,shortSet.has(i)?ex:null)));
      t.set(O("audit").doc(),auditRec(ex?"Exception dispatch":"Created","Challan",no,cd.party.trim()+" · "+cd.lines.length+" lines"+(ex?" · "+ex.reason:"")));
    });
    cd=null;viewing=ref.id;await loadAll();say(`Challan ${no} created. Stock deducted.`);
  }catch(e){err(e)}
};

function challanDetail(){
  const c=challans.find(x=>x.id===viewing);if(!c){viewing=null;return challansView()}
  const k=company,live=c.status!=="cancelled",anyPend=c.lines.some(l=>pend(l)>0);
  const canVerify=canEdit()&&c.status==="dispatched"&&(isAdmin()||c.createdUid!==me.uid);
  const showRet=live&&canCreateCh()&&anyPend,showBill=live&&canBill()&&anyPend&&!has("billing");
  const untouched=c.lines.every(l=>!l.billed&&!l.returned);
  return `<div class="row noprint" style="margin:0 0 10px"><button class="b s" onclick="viewing=null;draw()">← All challans</button><button class="b" onclick="window.print()">Print challan</button>
  ${canVerify?`<button class="b" onclick="verifyCh()">Verify (manager)</button>`:""}

window.recQty=async mode=>{
  const c=challans.find(x=>x.id===viewing),pre=mode==="return"?"rt":"bl";
  if(!c)return say("Open a challan first.",true);
  const qs=c.lines.map((l,i)=>Number(gv(pre+i))||0);
  if(!qs.some(q=>q>0))return say("Enter a quantity first.",true);

    await db.runTransaction(async t=>{
      const ref=D("challans/"+c.id),s=await t.get(ref);if(!s.exists)throw new Error("Challan not found.");
      const d=s.data();if(d.status==="cancelled")throw new Error("This challan is cancelled.");
      const lines=d.lines.map(l=>({...l})),nd={},txt=[];
      qs.forEach((q,i)=>{
        if(q<=0)return;const l=lines[i],room=pend(l);
        if(q>room)throw new Error(`${l.name}: only ${room} pending.`);
        if(mode==="return"){l.returned=rnd((l.returned||0)+q);comps(l,q).forEach(([it,n])=>nd[it]=rnd((nd[it]||0)+n))}
        else l.billed=rnd((l.billed||0)+q);

};

window.cancelCh=async()=>{

/* ================= BILLING (GST invoices, payments) ================= */
let bills=[],bd=null,viewingBill=null;
const PAYMODES=["UPI","NEFT/RTGS","Cash","Cheque","Other"];
const money=n=>Math.round((Number(n)||0)*100)/100;
const toPaise=n=>Math.round((Number(n)||0)*100);
const fmt=n=>money(n).toFixed(2);
const stateCode=g=>{const s=String(g||"").trim();return /^\d{2}/.test(s)?s.slice(0,2):""};
const isInterState=(sellerGstin,buyerGstin)=>{const a=stateCode(sellerGstin),b=stateCode(buyerGstin);return !!(a&&b&&a!==b)};
// Split an amount in proportion to weights. Paise-exact; the rounding remainder goes to the largest weights.
function splitByRatio(total,weights){
  const T=toPaise(total),w=weights.map(x=>toPaise(Math.max(0,Number(x)||0))),W=w.reduce((a,b)=>a+b,0);
  if(!w.length)return [];
  const base=W>0?w.map(x=>Math.floor(T*x/W)):w.map(()=>Math.floor(T/w.length));
  let rem=T-base.reduce((a,b)=>a+b,0);
  const order=w.map((_,i)=>i).sort((a,b)=>(W>0?w[b]-w[a]:0)||a-b);
  for(let k=0;rem>0;k++,rem--)base[order[k%order.length]]++;
  return base.map(p=>p/100);
}
// GST on a taxable amount. Intra-state: CGST and SGST (SGST takes any odd paisa). Inter-state: IGST.
function taxOf(taxable,gst,inter){
  const tr=Math.round(toPaise(taxable)*(Number(gst)||0)/100);
  if(inter)return {cgst:0,sgst:0,igst:tr/100};
  const cg=Math.floor(tr/2);return {cgst:cg/100,sgst:(tr-cg)/100,igst:0};
}
function billRow(it,code,qty,taxable,inter,from,rate,x){
  x=x||{};
  const gst=Number(it.gst)||0,tx=taxOf(taxable,gst,inter);
  return {code,name:it.name||code,hsn:it.hsn||"",unit:it.unit||"pcs",qty:rnd(qty),
    rate:rate!==undefined?rate:(qty?money(taxable/qty):0),
    gross:money(x.gross!==undefined?x.gross:taxable),disc:money(x.disc||0),offer:x.offer||"",
    taxable:money(taxable),gst,cgst:tx.cgst,sgst:tx.sgst,igst:tx.igst,
    amount:money(taxable+tx.cgst+tx.sgst+tx.igst),from:from||""};
}
/* ---------- OFFERS AND DISCOUNTS ---------- */
// Offer targets are "item:CODE" or "prod:CODE". Offers run inside their from/to dates.
const offerTarget=(kind,code)=>(kind==="product"?"prod:":"item:")+code;
function offerActive(o,target,date){
  return !!o&&o.active!==false&&o.target===target&&(!o.from||(date||"")>=o.from)&&(!o.to||(date||"")<=o.to);
}
// Discount in rupees for a line. "pct" is a percentage of the line; "flat" is rupees per unit, never more than the line.
function offerDisc(o,gross,qty){
  const v=Number(o.value)||0;if(v<=0)return 0;
  return o.type==="pct"?money(gross*v/100):money(Math.min(v*(qty||0),gross));
}
// A manual % typed on the line beats an automatic offer. Otherwise the best active offer for that target wins.
function lineDisc(gross,qty,target,dpct,date,offers){
  const p=Number(dpct)||0;
  if(p>0)return {disc:money(Math.min(gross,gross*p/100)),offer:"Manual "+p+"%"};
  let best=null;
  (offers||[]).forEach(o=>{if(!offerActive(o,target,date))return;const d=offerDisc(o,gross,qty);if(d>(best?best.d:0))best={o,d}});
  return best?{disc:money(Math.min(gross,best.d)),offer:best.o.name||"Offer"}:{disc:0,offer:""};
}
// Spread a bill-level discount over the lines (by their value after line discounts), then price each line with GST.
function finishRows(descs,inter,billDisc){
  const base=descs.map(d=>money(d.gross-d.disc));
  const total=money(base.reduce((a,b)=>a+b,0));
  const bd=billDisc||{},v=Number(bd.value)||0;
  let extra=0;
  if(v>0&&total>0)extra=bd.type==="pct"?money(total*v/100):money(Math.min(v,total));
  const shares=extra>0?splitByRatio(extra,base):base.map(()=>0);
  return descs.map((d,i)=>{
    const share=shares[i]||0,disc=money(d.disc+share),taxable=money(d.gross-disc);
    return billRow(d.it,d.code,d.qty,taxable,inter,d.from,d.rate,{gross:d.gross,disc,offer:d.offer});
  });
}
// Turn challan selections into bill lines. sel[i] = {qty, rate, amt, comp, dpct} as typed; "" means default.
// opts: over (allow beyond pending), offers, date, billDisc {type,value}. Returns {lines, used}; throws a readable error.
function billLinesFor(lines,sel,itemsById,inter,opts){
  const over=!!(opts&&opts.over),offers=(opts&&opts.offers)||[],date=(opts&&opts.date)||"",billDisc=(opts&&opts.billDisc)||null;
  const descs=[],used=[];
  lines.forEach((l,i)=>{
    const s=sel[i]||{},q=Number(s.qty)||0;
    if(q<=0)return;
    const room=pend(l);
    if(q>room+1e-9&&!over)throw new Error(`${l.name}: only ${room} pending.`);
    used.push({li:i,q});
    if(l.kind==="product"){
      const comps=l.comp||[],weights=comps.map(c=>((itemsById[c.item]||{}).rate||0)*c.qty*q);
      const amt=(s.amt!==undefined&&s.amt!=="")?money(s.amt):money(weights.reduce((a,b)=>a+b,0));
      const fixed=comps.map((_,j)=>{const v=(s.comp||[])[j];return (v!==undefined&&v!=="")?money(v):null});
      const fixedSum=money(fixed.reduce((a,v)=>a+(v||0),0));
      const free=comps.map((_,j)=>j).filter(j=>fixed[j]===null);
      if(fixedSum>amt+0.005)throw new Error(`${l.name}: component amounts add to ${fixedSum}, more than the product amount ${amt}.`);
      const amounts=fixed.slice();
      if(free.length){const rest=splitByRatio(money(amt-fixedSum),free.map(j=>weights[j]));free.forEach((j,k)=>amounts[j]=rest[k])}
      else if(Math.abs(fixedSum-amt)>0.005)throw new Error(`${l.name}: component amounts add to ${fixedSum}, but the product amount is ${amt}.`);
      const dl=lineDisc(amt,q,offerTarget("product",l.code),s.dpct,date,offers);
      const dsplit=splitByRatio(dl.disc,amounts);
      comps.forEach((c,j)=>{
        const it=itemsById[c.item]||{},cq=rnd(c.qty*q);
        descs.push({it,code:c.item,qty:cq,gross:amounts[j],disc:dsplit[j]||0,offer:dl.offer,from:l.code+" "+l.name,rate:cq?money(amounts[j]/cq):0});
      });
    }else{
      const it=itemsById[l.ref]||{};
      const rate=(s.rate!==undefined&&s.rate!=="")?money(s.rate):money(it.rate||0);
      const gross=money(q*rate),dl=lineDisc(gross,q,offerTarget("item",l.ref),s.dpct,date,offers);
      descs.push({it,code:l.ref,qty:q,gross,disc:dl.disc,offer:dl.offer,from:null,rate});
    }
  });
  return {lines:finishRows(descs,inter,billDisc),used};
}
// Direct bill (no challan): rows are typed in, of kind "item" or "product". Products are priced like challan products.
function directLinesFor(rows,itemMap,inter,opts){
  const pmap=Object.fromEntries(((opts&&opts.products)||[]).map(p=>[p.code,p]));
  const flines=[],sel=[];
  rows.forEach(r=>{
    const q=Number(r.qty)||0;if(q<=0)return;
    if(r.kind==="product"){
      const p=pmap[r.code];if(!p)throw new Error("Choose a product for each line that has a quantity.");
      flines.push({kind:"product",code:p.code,name:p.name,comp:(p.lines||[]).map(c=>({item:c.item,qty:c.qty})),out:q,billed:0,returned:0});
      sel.push({qty:q,amt:r.amt,comp:r.comp||[],dpct:r.dpct});
    }else{
      const it=itemMap[r.code];if(!it)throw new Error("Choose an item for each line that has a quantity.");
      const rate=money(r.rate);if(rate<0)throw new Error(`${it.name}: rate cannot be negative.`);
      flines.push({kind:"item",ref:r.code,name:it.name,out:q,billed:0,returned:0});
      sel.push({qty:q,rate,dpct:r.dpct});
    }
  });
  if(!flines.length)throw new Error("Add at least one line with a quantity.");
  return billLinesFor(flines,sel,itemMap,inter,{...(opts||{}),over:true}).lines;
}
function billTotals(lines){
  const sum=k=>money(lines.reduce((a,l)=>a+(l[k]||0),0));
  const taxable=sum("taxable"),cgst=sum("cgst"),sgst=sum("sgst"),igst=sum("igst"),gross=sum("gross"),disc=sum("disc");
  const grand=money(taxable+cgst+sgst+igst),total=Math.round(grand);
  return {gross,disc,taxable,cgst,sgst,igst,tax:money(cgst+sgst+igst),grand,roundOff:money(total-grand),total};
}

window.saveBill=async()=>{
  bdSync();
  const items=itemsById(),direct=bd.mode==="direct",bdisc=billDiscOf(bd.billDisc);
  const pay=bd.pay?payFrom(bd.pay):null;
  if(bd.pay&&Number(bd.pay.amount)<0)return say("Payment amount cannot be negative.",true);
  const opts={offers,date:bd.date||today(),billDisc:bdisc,products};
  let c=null,issues=[];
  try{
    if(direct){
      if(!(bd.party||"").trim())return say("Enter the party name.",true);
      directLinesFor(bd.direct,items,bd.inter,opts);
      issues=["direct bill with no challan"];
    }else{
      c=challans.find(x=>x.id===bd.cid);
      if(!c)return say("Choose a challan to bill, or use a direct bill.",true);
      issues=challanIssues(c,bd.sel);
      if(!issues.length)billLinesFor(c.lines,bd.sel,items,bd.inter,opts);
    }
  }catch(e){return err(e)}
  let ex=null;
  if(issues.length){
    ex=await askException(direct?"Direct bill (no challan)":"Bill beyond challan",issues.join("; "));
    if(!ex)return;
  }
  const kref=D("counters/bill"),bref=O("bills").doc(),at=Date.now();
  let no;
  try{
    await db.runTransaction(async t=>{
      const ks=await t.get(kref);
      let built,fresh=null,cref=null;
      if(direct){built={lines:directLinesFor(bd.direct,items,bd.inter,opts),used:[]}}
      else{
        cref=D("challans/"+c.id);fresh=(await t.get(cref)).data();
        if(!fresh)throw new Error("Challan not found.");
        const now=challanIssues(fresh,bd.sel);
        if(now.length&&!ex)throw new Error("The challan changed while you were editing: "+now.join("; ")+". Review and try again.");
        built=billLinesFor(fresh.lines,bd.sel,items,bd.inter,{...opts,over:true});
        if(!built.used.length)throw new Error("Enter a quantity to bill.");
      }
      const tot=billTotals(built.lines);
      const payments=pay?[{...pay,by:me.name,at}]:[];
      if(paidOf({payments})>tot.total+0.005)throw new Error("Payment is more than the bill total.");
      const n=((ks.exists&&ks.data().bill)||0)+1;no="INV-"+String(n).padStart(4,"0");
      const log=[{t:direct?"Direct bill created":"Bill created from "+fresh.no,by:me.name,at}];
      if(ex)log.push({t:"EXCEPTION: "+ex.type+" – "+ex.reason+" (approved by "+ex.approver+")",by:me.name,at});
      if(tot.disc>0)log.push({t:"Discount given: "+fmt(tot.disc),by:me.name,at});
      const bill={no,date:bd.date||today(),direct,
        party:direct?bd.party.trim():(fresh.party||""),addr:direct?(bd.addr||"").trim():(fresh.addr||""),
        gstin:direct?(bd.gstin||"").trim():(fresh.gstin||""),phone:direct?(bd.phone||"").trim():(fresh.phone||""),
        toPlace:(bd.toPlace||"").trim(),toPincode:(bd.toPincode||"").trim(),
        inter:!!bd.inter,challanIds:direct?[]:[c.id],challanNos:direct?[]:[fresh.no],lines:built.lines,
        fromLines:built.used.map(u=>({cid:c.id,li:u.li,q:u.q})),
        ...tot,billDisc:bdisc,payments,paid:paidOf({payments}),cancelled:false,exception:ex,eway:{},
        createdBy:me.name,createdUid:me.uid,at,log};
      bill.status=payStatusOf(bill);
      if(!direct){
        const lines=fresh.lines.map((l,i)=>{const u=built.used.find(x=>x.li===i);return u?{...l,billed:rnd((l.billed||0)+u.q)}:l});
        t.update(cref,{lines,log:[...(fresh.log||[]),{t:"Billed in "+no+(ex?" (exception)":""),by:me.name,at}]});
      }
      t.set(kref,{bill:n},{merge:true});
      t.set(bref,bill);
      t.set(O("audit").doc(),auditRec(ex?"Exception bill":"Created","Bill",no,(direct?"direct to "+bill.party:fresh.no)+" · total "+tot.total+(tot.disc?" · discount "+fmt(tot.disc):"")+(ex?" · "+ex.type+": "+ex.reason:"")));
    });
    bd=null;viewingBill=bref.id;await loadAll();say(`Bill ${no} saved${ex?" with exception recorded":""}.`);
  }catch(e){err(e)}
};

window.addPay=async id=>{
  const amount=money(gv("pa_"+id)),mode=gv("pm_"+id)||"UPI",ref=gv("pr_"+id).trim(),date=gv("pd_"+id)||today();
  if(!(amount>0))return say("Enter an amount above zero.",true);
  try{
    await db.runTransaction(async t=>{
      const r=D("bills/"+id),b=(await t.get(r)).data();
      if(!b)throw new Error("Bill not found.");
      if(b.cancelled)throw new Error("This bill is cancelled.");
      const bal=balanceOf(b);
      if(amount>bal+0.005)throw new Error(`Amount is more than the balance of ${fmt(bal)}.`);
      const payments=[...(b.payments||[]),{mode,amount,ref,date,by:me.name,at:Date.now()}];
      const next={...b,payments};
      t.update(r,{payments,paid:paidOf(next),status:payStatusOf(next),log:[...(b.log||[]),{t:"Payment: "+mode+" "+fmt(amount),by:me.name,at:Date.now()}]});
      t.set(O("audit").doc(),auditRec("Payment","Bill",b.no,mode+" "+fmt(amount)+(ref?" · "+ref:"")));
    });
    await loadAll();say("Payment recorded.");
  }catch(e){err(e)}
};
window.reversePay=async(id,idx)=>{

      t.update(r,{payments,paid:paidOf(next),status:payStatusOf(next),log:[...(b.log||[]),{t:"Payment reversed: "+p.mode+" "+fmt(p.amount),by:me.name,at:Date.now()}]});

window.cancelBill=async id=>{
  if(!confirm("Cancel this bill? Its billed quantities go back to the challan so they can be billed again."))return;
  try{
    await db.runTransaction(async t=>{
      const br=D("bills/"+id),b=(await t.get(br)).data();
      if(!b)throw new Error("Bill not found.");
      if(b.cancelled)throw new Error("Already cancelled.");
      if(paidOf(b)>0)throw new Error("Reverse the payments on this bill before cancelling it.");
      const cids=[...new Set((b.fromLines||[]).map(x=>x.cid))];
      const snaps=[];
      for(const cid of cids)snaps.push(await t.get(D("challans/"+cid)));   // all reads before any write
      const writes=[];
      snaps.forEach((s,k)=>{
        const d=s.data(),lines=d.lines.map(l=>({...l}));
        (b.fromLines||[]).filter(x=>x.cid===cids[k]).forEach(x=>{
          const l=lines[x.li];
          if(!l||(l.billed||0)<x.q)throw new Error(`Cannot restore ${x.q} on ${d.no}: billed quantity is lower than this bill.`);
          l.billed=rnd(l.billed-x.q);
        });
        writes.push([cids[k],{lines,log:[...(d.log||[]),{t:"Bill "+b.no+" cancelled; billed qty restored",by:me.name,at:Date.now()}]}]);
      });
      writes.forEach(([cid,data])=>t.update(D("challans/"+cid),data));
      t.update(br,{cancelled:true,status:"cancelled",log:[...(b.log||[]),{t:"Cancelled",by:me.name,at:Date.now()}]});
      t.set(O("audit").doc(),auditRec("Cancelled","Bill",b.no,"billed qty restored on "+cids.length+" challan(s)"));
    });
    await loadAll();say("Bill cancelled and billed quantities restored.");
  }catch(e){err(e)}
};

/* ---------- EXCEPTIONS: pure rules (tested in tests/) ---------- */
const approverProblem=(role,approverUid,meUid)=>approverUid===meUid?null:"An exception must be approved by the user who raised it.";
const exceptionRecord=(type,reason,meU,ap,at)=>({type:String(type||"Exception"),reason:String(reason||"").trim().slice(0,300),by:meU.name,byUid:meU.uid,approver:ap.approver,approverUid:ap.approverUid,approverRole:ap.approverRole,at});
// Goods receipt against a purchase order. Quantity above what is still due is an "over" that needs an exception.
function receiveCalc(lines,qtys){
  const rec=[],over=[],out=lines.map(l=>({...l}));
  lines.forEach((l,i)=>{
    const q=Number(qtys[i])||0;if(q<=0)return;
    const room=Math.max(0,rnd((l.ordered||0)-(l.received||0)));
    const normal=Math.min(q,room),extra=rnd(q-normal);
    out[i].received=rnd((l.received||0)+q);
    rec.push({li:i,q,normal:rnd(normal),over:extra});
    if(extra>0)over.push({li:i,name:l.name,over:extra});
  });
  if(!rec.length)throw new Error("Enter a quantity to receive.");
  const status=out.every(l=>(l.received||0)>=(l.ordered||0))?"received":"partial";
  return {lines:out,rec,over,status};
}
/* ---------- REPORT CALCULATIONS (pure) ---------- */
const inRange=(d,from,to)=>(!from||(d||"")>=from)&&(!to||(d||"")<=to);
const sumOf=(arr,fn)=>money(arr.reduce((a,x)=>a+(Number(fn(x))||0),0));
function salesSummary(bs,from,to){
  const rows=bs.filter(b=>!b.cancelled&&inRange(b.date,from,to));
  return {count:rows.length,taxable:sumOf(rows,b=>b.taxable),tax:sumOf(rows,b=>b.tax),total:sumOf(rows,b=>b.total),paid:sumOf(rows,paidOf),balance:sumOf(rows,balanceOf)};
}
function receivables(bs){
  const m={};
  bs.filter(b=>!b.cancelled).forEach(b=>{const r=m[b.party]||(m[b.party]={party:b.party,billed:0,paid:0,balance:0});r.billed=money(r.billed+(b.total||0));r.paid=money(r.paid+paidOf(b));r.balance=money(r.balance+balanceOf(b))});
  return Object.values(m).filter(r=>r.balance>0.004).sort((a,b)=>b.balance-a.balance);
}
// Same rule as the app's stock balances: available = in + return - out - damage. Can be negative after an exception.
function stockAvail(rows){
  const m={};
  rows.forEach(s=>{const k=s.wh+"|"+s.item,o=m[k]||(m[k]={wh:s.wh,item:s.item,in:0,out:0,return:0,damage:0});o[s.type]=rnd((o[s.type]||0)+(Number(s.qty)||0))});
  return Object.values(m).map(o=>({...o,avail:rnd((o.in||0)+(o.return||0)-(o.out||0)-(o.damage||0))}));
}
function stockValueRows(rows,itemMap,whMap){
  return stockAvail(rows).filter(r=>r.avail!==0).map(r=>{const it=itemMap[r.item]||{},rate=it.rate||0;return {wh:(whMap[r.wh]||{}).name||r.wh,item:it.code||r.item,name:it.name||r.item,qty:r.avail,rate,value:money(r.avail*rate)}})
    .sort((a,b)=>a.wh.localeCompare(b.wh)||a.item.localeCompare(b.item));
}
function pendingChallanRows(cs){
  return cs.filter(c=>c.status!=="cancelled").map(c=>({no:c.no,date:c.date,party:c.party,pending:rnd(c.lines.reduce((a,l)=>a+Math.max(0,pend(l)),0))})).filter(r=>r.pending>0);
}
function exceptionRows(bs,cs,st,ps){
  const rows=[],add=(kind,ref,date,e)=>rows.push({kind,ref,date,type:e.type,reason:e.reason,by:e.by,approver:e.approver,at:e.at});
  bs.forEach(b=>b.exception&&add("Bill",b.no,b.date,b.exception));
  cs.forEach(c=>c.exception&&add("Challan",c.no,c.date,c.exception));
  st.forEach(s=>s.exception&&add("Stock",s.ref||"",s.at?new Date(s.at).toISOString().slice(0,10):"",s.exception));
  ps.forEach(p=>p.exception&&add("Purchase",p.no,p.date,p.exception));
  return rows.sort((a,b)=>(b.at||0)-(a.at||0));
}
function purchaseSummary(ps,from,to){

}
/* ---------- CSV (spreadsheet-safe) ---------- */
const csvCell=v=>{
  if(typeof v==="number")return String(v);
  let s=String(v??"");
  if(/^[=+\-@\t\r]/.test(s))s="'"+s;           // stops spreadsheet formula injection

};
const toCSV=(head,rows)=>[head,...rows].map(r=>r.map(csvCell).join(",")).join("\r\n");

window.receivePO=async id=>{
  const p=purchases.find(x=>x.id===id);if(!p)return;
  const qtys=p.lines.map((_,i)=>gv("rq"+i));
  let calc;try{calc=receiveCalc(p.lines,qtys)}catch(e){return err(e)}
  let ex=null;
  if(calc.over.length){
    ex=await askException("Receive more than ordered",calc.over.map(o=>`${o.name}: ${o.over} over the order`).join("; "));
    if(!ex)return;
  }
  try{
    await db.runTransaction(async t=>{
      const r=D("purchases/"+id),d=(await t.get(r)).data();
      if(!d)throw new Error("Order not found.");
      if(d.status==="cancelled")throw new Error("This order is cancelled.");
      const c2=receiveCalc(d.lines,qtys);
      if(c2.over.length&&!ex)throw new Error("Quantities changed while you were editing. Review and try again.");
      const summary=c2.rec.map(x=>`${d.lines[x.li].name} ×${x.q}`).join(", ");
      c2.rec.forEach(x=>{
        const code=d.lines[x.li].code;
        if(x.normal>0)t.set(O("stock").doc(),stockDoc(d.wh,code,"in",x.normal,d.no,id,null));
        if(x.over>0)t.set(O("stock").doc(),stockDoc(d.wh,code,"in",x.over,d.no,id,ex));
      });
      t.update(r,{lines:c2.lines,status:c2.status,exception:ex||d.exception||null,log:[...(d.log||[]),{t:"Received: "+summary+(ex?" · EXCEPTION: "+ex.reason:""),by:me.name,at:Date.now()}]});
      t.set(O("audit").doc(),auditRec(ex?"Exception receipt":"Received","Purchase order",d.no,summary+(ex?" · "+ex.type+": "+ex.reason:"")));
    });
    await loadAll();say("Goods received into stock.");
  }catch(e){err(e)}
};
window.cancelPO=async id=>{
  if(!confirm("Cancel this purchase order?"))return;
  try{
    await db.runTransaction(async t=>{
      const r=D("purchases/"+id),d=(await t.get(r)).data();
      if(!d)throw new Error("Order not found.");
      if(d.status==="cancelled")throw new Error("Already cancelled.");
      if(d.lines.some(l=>(l.received||0)>0))throw new Error("Goods are already received against this order, so it cannot be cancelled.");
      t.update(r,{status:"cancelled",log:[...(d.log||[]),{t:"Cancelled",by:me.name,at:Date.now()}]});
      t.set(O("audit").doc(),auditRec("Cancelled","Purchase order",d.no,""));
    });
    await loadAll();say("Order cancelled.");
  }catch(e){err(e)}
};

/* ---------- DRAFTS: which screens keep their state object, and how field values are keyed ---------- */
const STATE_TABS=["challans","bills","purchases","products"];
const fmKey=(tab,editing)=>tab+"|"+(editing||"new");
/* ---------- PURCHASE INVOICE READING (from Excel/CSV rows; no OCR) ---------- */
const normKey=s=>String(s??"").toLowerCase().replace(/[^a-z0-9%]+/g," ").trim();
const num=v=>{const n=parseFloat(String(v??"").replace(/[^0-9.\-]/g,""));return isFinite(n)?n:0};
function normDate(v){
  if(v===""||v==null)return "";
  if(typeof v==="number"){const d=new Date(Math.round((v-25569)*86400000));return isNaN(d)?"":d.toISOString().slice(0,10)}
  const s=String(v).trim();
  let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);if(m)return m[1]+"-"+m[2].padStart(2,"0")+"-"+m[3].padStart(2,"0");
  m=s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})$/);
  if(m){const y=m[3].length===2?"20"+m[3]:m[3];return y+"-"+m[2].padStart(2,"0")+"-"+m[1].padStart(2,"0")}
  return "";
}
function detectHeader(rows){
  let best=-1,score=0;
  rows.slice(0,60).forEach((r,i)=>{
    const c=(r||[]).map(normKey);
    let sc=0;
    if(c.some(x=>/item|description|particular|product|goods/.test(x)))sc++;
    if(c.some(x=>/^qty|quantity|nos|pcs/.test(x)))sc++;
    if(c.some(x=>/rate|price/.test(x)))sc++;
    if(c.some(x=>/amount|value|total/.test(x)))sc++;
    if(sc>score&&sc>=2){score=sc;best=i}
  });
  return best;
}
function columnMap(header){
  const c=header.map(normKey),find=re=>c.findIndex(x=>re.test(x));
  let name=find(/item name|description|particular|product|goods/);if(name<0)name=find(/item/);
  let code=find(/^(item )?code$|^sku|part no|item code/);if(code===name)code=-1;
  return {name,code,hsn:find(/hsn|sac/),qty:find(/^qty|quantity|nos|pcs/),rate:find(/rate|price/),
    amount:find(/amount|taxable|value|total/),gst:find(/gst|tax/)};
}
function metaFrom(rows,upto){
  const out={};
  for(let i=0;i<upto;i++){
    (rows[i]||[]).forEach((cell,j,r)=>{
      const raw=String(cell??""),parts=raw.split(":");
      const key=normKey(parts[0]),inline=parts.length>1?parts.slice(1).join(":").trim():"";
      const after=()=>inline||String(r.slice(j+1).find(v=>String(v??"").trim()!=="")??"").trim();
      if(/supplier|vendor|seller|party name|bill from/.test(key)&&!out.supplier)out.supplier=after();
      else if(/invoice no|invoice number|invoice #|bill no|bill number|inv no/.test(key)&&!out.invoiceNo)out.invoiceNo=after();
      else if(/^date$|invoice date|bill date/.test(key)&&!out.invoiceDate)out.invoiceDate=after();
      else if(/gstin/.test(key)&&!out.gstin)out.gstin=after();
    });
  }
  return out;
}
// Reads an invoice laid out as rows of cells. Returns suggested header fields and lines, plus warnings.
function parseInvoiceRows(rows){
  const h=detectHeader(rows),warnings=[];
  if(h<0)return {ok:false,lines:[],warnings:["Could not find the line-item header (item or description, quantity, rate or amount)."]};
  const m=columnMap(rows[h]),meta=metaFrom(rows,h);
  if(m.name<0)warnings.push("No item or description column found.");
  if(m.qty<0)warnings.push("No quantity column found.");
  if(m.rate<0&&m.amount<0)warnings.push("No rate or amount column found.");
  const lines=[];let total=null;
  for(let i=h+1;i<rows.length;i++){
    const r=rows[i]||[];
    const name=String(r[m.name]??"").trim(),code=m.code>=0?String(r[m.code]??"").trim():"";
    const nk=normKey(name||(r.find(x=>String(x??"").trim()!=="")??""));
    if(/total/.test(nk)&&!/^item/.test(nk)){
      const col=m.amount>=0?m.amount:r.length-1,v=num(r[col]);if(v>0)total=money(v);continue;
    }
    if(!name&&!code)continue;
    const qty=num(r[m.qty]),rate=m.rate>=0?num(r[m.rate]):0,amount=m.amount>=0?num(r[m.amount]):0;
    if(!(qty>0)){warnings.push(`Row ${i+1} "${name||code}": no quantity, not added.`);continue}
    lines.push({name,code,qty:rnd(qty),rate:money(rate||(amount&&qty?amount/qty:0)),amount:money(amount||qty*rate),
      gst:m.gst>=0&&r[m.gst]!==""?num(r[m.gst]):null,hsn:m.hsn>=0?String(r[m.hsn]??"").trim():"",raw:i+1});
  }
  if(!lines.length)warnings.push("No line items found under the header.");
  return {ok:lines.length>0,supplier:meta.supplier||"",invoiceNo:meta.invoiceNo||"",invoiceDate:normDate(meta.invoiceDate),
    gstin:meta.gstin||"",invoiceTotal:total,lines,warnings};
}
// Best item for a line: exact code first, then exact name, then word overlap (needs 60% to count).
function matchItem(line,itemList){
  const code=normKey(line.code),name=normKey(line.name);
  if(code){const hit=itemList.find(it=>normKey(it.code)===code);if(hit)return {item:hit,score:1}}
  let best=null,score=0;
  itemList.forEach(it=>{
    const n=normKey(it.name);let s=0;
    if(n&&n===name)s=1;
    else if(name&&n){const a=new Set(name.split(" ")),b=new Set(n.split(" "));const common=[...a].filter(x=>b.has(x)).length;s=common/Math.max(a.size,b.size)}
    if(s>score){score=s;best=it}
  });
  return {item:score>=0.6?best:null,score:Math.round(score*100)/100};
}
// Problems that stop an entry from being approved, and softer warnings that do not.
function checkDirectPurchase(dp,itemMap){
  const blocking=[],soft=[];
  if(!(dp.supplier||"").trim())blocking.push("Enter the supplier name.");
  if(!dp.wh)blocking.push("Choose the receiving warehouse.");
  if(!dp.lines.length)blocking.push("Add at least one line.");
  let sum=0;
  dp.lines.forEach((l,i)=>{
    const q=Number(l.qty)||0;
    if(!itemMap[l.code])blocking.push(`Line ${i+1}: choose the item.`);
    if(!(q>0))blocking.push(`Line ${i+1}: enter a quantity above zero.`);
    if((Number(l.rate)||0)<0)blocking.push(`Line ${i+1}: rate cannot be negative.`);
    const amt=money(Number(l.amount)||q*(Number(l.rate)||0));
    if(l.amount!==undefined&&l.amount!==""&&Math.abs(amt-q*(Number(l.rate)||0))>1)soft.push(`Line ${i+1}: quantity × rate does not match the amount on the invoice.`);
    sum+=amt;
  });
  const inv=Number(dp.invoiceTotal);
  if(inv>0&&Math.abs(money(sum)-inv)>1)soft.push(`Lines add to ${fmt(sum)} but the invoice total is ${fmt(inv)}.`);
  return {blocking,soft};
}

/* ---------- E-WAY BILL (bulk-upload JSON for the GST portal) ---------- */
const EWB_VERSION="1.0.0419";   // bulk-upload template version: check this against the portal's current template
const EWB_THRESHOLD=50000;
const GSTIN_RE=/^\d{2}[A-Z]{5}\d{4}[A-Z][1-9A-Z]Z[0-9A-Z]$/;
const PIN_RE=/^[1-9]\d{5}$/;
const UQC={pcs:"PCS",pc:"PCS",piece:"PCS",nos:"NOS",no:"NOS",kg:"KGS",kgs:"KGS",bag:"BAG",btl:"BTL",bottle:"BTL",box:"BOX",ltr:"LTR",l:"LTR",litre:"LTR",mtr:"MTR",m:"MTR",set:"SET",pack:"PAC",pkt:"PAC",roll:"ROL",can:"CAN",gm:"GMS",g:"GMS",ton:"MTS"};
const uqc=u=>UQC[String(u||"").toLowerCase().trim()]||"OTH";
const ddmmyyyy=d=>{const m=String(d||"").match(/^(\d{4})-(\d{2})-(\d{2})$/);return m?m[3]+"/"+m[2]+"/"+m[1]:""};
// Problems that stop a bill going into the e-way file. Empty list = ready.
function ewayProblems(bill,co){
  const p=[],e=bill.eway||{};
  if(!GSTIN_RE.test(co.gstin||""))p.push("Your company GSTIN is missing or invalid (Company & plan).");
  if(!PIN_RE.test(String(co.pincode||"")))p.push("Your company pincode is missing (Company & plan).");
  if(bill.gstin&&!GSTIN_RE.test(bill.gstin))p.push("Party GSTIN is invalid.");
  if(!PIN_RE.test(String(bill.toPincode||"")))p.push("Ship-to pincode is missing or invalid.");
  if(!(bill.lines||[]).length)p.push("Bill has no lines.");
  (bill.lines||[]).forEach(l=>{if(!/^\d{4}(\d{2}|\d{4})?$/.test(String(l.hsn||"")))p.push(`${l.name}: HSN code is missing or invalid.`)});
  if(!ddmmyyyy(bill.date))p.push("Bill date is missing.");
  const big=Number(bill.total)>EWB_THRESHOLD;
  if(big&&!e.vehicleNo&&!e.transporterId)p.push(`Value is above ₹${EWB_THRESHOLD}: enter a vehicle number or transporter ID.`);
  if(big&&!(Number(e.distance)>0))p.push(`Value is above ₹${EWB_THRESHOLD}: enter the distance in km.`);
  if(!bill.gstin&&bill.inter&&!e.toState)p.push("Inter-state bill to an unregistered party: enter the ship-to state code.");
  return p;
}
// One bill in the portal's bulk-upload layout.
function ewayBill(bill,co){
  const e=bill.eway||{},fromState=stateCode(co.gstin),toState=e.toState||stateCode(bill.gstin)||fromState,inter=!!bill.inter;
  return {
    supplyType:"O",subSupplyType:"1",subSupplyDesc:"",docType:"INV",docNo:String(bill.no),docDate:ddmmyyyy(bill.date),
    fromGstin:co.gstin||"",fromTrdName:co.name||"",fromAddr1:String(co.addr||"").slice(0,120),fromAddr2:"",
    fromPlace:String(co.place||co.addr||"").slice(0,50),fromPincode:Number(co.pincode)||0,
    actFromStateCode:Number(fromState)||0,fromStateCode:Number(fromState)||0,
    toGstin:bill.gstin||"URP",toTrdName:bill.party||"",toAddr1:String(bill.addr||"").slice(0,120),toAddr2:"",
    toPlace:String(bill.toPlace||"").slice(0,50),toPincode:Number(bill.toPincode)||0,
    actToStateCode:Number(toState)||0,toStateCode:Number(toState)||0,
    transactionType:1,totalValue:money(bill.taxable),cgstValue:money(bill.cgst),sgstValue:money(bill.sgst),igstValue:money(bill.igst),
    cessValue:0,cessNonAdvolValue:0,otherValue:0,totInvValue:money(bill.total),
    transporterId:e.transporterId||"",transporterName:e.transporterName||"",transDocNo:e.transDocNo||"",transDocDate:ddmmyyyy(e.transDocDate||""),
    transMode:String(e.transMode||"1"),transDistance:String(Math.round(Number(e.distance)||0)),
    vehicleNo:String(e.vehicleNo||"").replace(/\s/g,"").toUpperCase(),vehicleType:"R",
    itemList:(bill.lines||[]).map((l,i)=>{
      const g=Number(l.gst)||0;
      return {itemNo:i+1,productName:l.name,productDesc:l.name,hsnCode:String(l.hsn||""),quantity:Number(l.qty)||0,qtyUnit:uqc(l.unit),
        taxableAmount:money(l.taxable),sgstRate:inter?0:g/2,cgstRate:inter?0:g/2,igstRate:inter?g:0,cessRate:0,cessAdvol:0};
    })
  };
}
// Builds the file from the bills that are ready. Bills with problems are returned with their reasons, not silently dropped.
function ewayFile(bills,co){
  const ok=[],skipped=[];
  bills.forEach(b=>{const p=ewayProblems(b,co);if(p.length)skipped.push({no:b.no,problems:p});else ok.push(ewayBill(b,co))});
  return {json:{version:EWB_VERSION,billLists:ok},included:ok.length,skipped};
}
/* ---------- PAYABLES (what we owe suppliers) ---------- */
// Payable on a purchase = received value plus GST, cancelled orders owe nothing.
function purchaseTotal(p){
  if(p.status==="cancelled")return 0;
  return money((p.lines||[]).reduce((a,l)=>{const r=(Number(l.received)||0)*(Number(l.rate)||0);return a+r+r*(Number(l.gst)||0)/100},0));
}
const purchasePaid=p=>money((p.payments||[]).reduce((a,x)=>a+(Number(x.amount)||0),0));
const payableOf=p=>money(purchaseTotal(p)-purchasePaid(p));
function payables(ps){
  const m={};
  ps.filter(p=>p.status!=="cancelled").forEach(p=>{
    const r=m[p.supplier]||(m[p.supplier]={supplier:p.supplier,billed:0,paid:0,balance:0});
    r.billed=money(r.billed+purchaseTotal(p));r.paid=money(r.paid+purchasePaid(p));r.balance=money(r.balance+payableOf(p));
  });
  return Object.values(m).filter(r=>r.balance>0.004).sort((a,b)=>b.balance-a.balance);
}

/* ---------- EXCEPTION POPUP (the user who raised it approves it) ----------
   Positioned with explicit top/left/right/bottom so it shows on older browsers too. */
function askException(type,detail){
  return new Promise(resolve=>{
    const wrap=document.createElement("div");
    wrap.className="modal";
    wrap.setAttribute("style","position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:2147483000;padding:12px;overflow:auto;box-sizing:border-box");
    wrap.innerHTML=`<div role="dialog" aria-modal="true" aria-labelledby="axh" style="background:#fff;border-radius:12px;padding:18px;max-width:460px;width:100%;color:#1d2a24;font:15px/1.45 system-ui,sans-serif;box-sizing:border-box">
      <h2 id="axh" style="margin:0 0 8px;font-size:18px">Exception</h2>
      <p style="margin:0 0 6px"><b>${esc(type)}</b></p>
      <p style="margin:0 0 10px;color:#66756d;white-space:normal">${esc(detail)}</p>
      <label for="axr" style="display:block;font-size:12px;color:#66756d;margin-bottom:2px">Reason (required)</label>
      <input id="axr" style="width:100%;padding:9px;border:1px solid #d9e0db;border-radius:7px;font:inherit;box-sizing:border-box">
      <label style="display:flex;gap:8px;align-items:center;margin-top:12px;font-size:15px;color:#1d2a24"><input type="checkbox" id="axc" style="width:auto"> I approve this exception as ${esc((me||{}).name||"")}</label>
      <div id="axm" role="alert" style="display:none;margin-top:10px;padding:9px 12px;border-radius:8px;background:#fbeaea;color:#b3261e"></div>
      <div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap">
        <button id="axok" style="background:#14594a;color:#fff;border:0;border-radius:8px;padding:9px 14px;font:inherit;cursor:pointer">Approve and continue</button>
        <button id="axno" style="background:#fff;color:#14594a;border:1px solid #14594a;border-radius:8px;padding:9px 14px;font:inherit;cursor:pointer">Cancel</button></div></div>`;
    document.body.appendChild(wrap);
    const msg=wrap.querySelector("#axm");
    const done=v=>{document.removeEventListener("keydown",onKey);wrap.remove();resolve(v)};
    const onKey=e=>{if(e.key==="Escape")done(null)};
    document.addEventListener("keydown",onKey);
    const tryApprove=()=>{
      const reason=wrap.querySelector("#axr").value.trim(),ticked=wrap.querySelector("#axc").checked;
      if(!reason){msg.textContent="Enter the reason for the exception.";msg.style.display="block";wrap.querySelector("#axr").focus();return}
      if(!ticked){msg.textContent="Tick the box to approve it.";msg.style.display="block";return}
      done(exceptionRecord(type,reason,me,{approverUid:me.uid,approver:me.name,approverRole:me.role},Date.now()));
    };
    wrap.querySelector("#axok").onclick=tryApprove;
    wrap.querySelector("#axno").onclick=()=>done(null);
    wrap.querySelector("#axr").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();tryApprove()}});
    setTimeout(()=>wrap.querySelector("#axr").focus(),0);
  });
}

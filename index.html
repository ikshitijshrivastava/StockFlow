const offerStatus=o=>{
  const d=today();
  if(o.active===false)return ["Off","x"];
  if(o.from&&d<o.from)return ["Scheduled","w"];
  if(o.to&&d>o.to)return ["Ended","x"];
  return ["Running","ok"];
};
function offersView(){
  const its=Object.values(itemsById()).sort((a,b)=>a.code.localeCompare(b.code));
  const ps=(products||[]).slice().sort((a,b)=>a.code.localeCompare(b.code));
  const targets=`<option value="">Choose…</option><optgroup label="Items">${its.map(i=>`<option value="item:${esc(i.id)}">${esc(i.code+" – "+i.name)}</option>`).join("")}</optgroup><optgroup label="Products">${ps.map(p=>`<option value="prod:${esc(p.code)}">${esc(p.code+" – "+p.name)}</option>`).join("")}</optgroup>`;
  const form=canEdit()?`<div class="card"><h2>New offer</h2><p class="mut">A discount on one item or product for a set period. A discount typed on a bill line overrides the offer for that line. Leave the end date blank for no end.</p>
    <div class="g"><div><label>Offer name</label><input id="ofn" placeholder="e.g. Diwali 10% off rice"></div>
    <div><label>Applies to</label><select id="oft">${targets}</select></div>
    <div><label>Discount type</label><select id="ofk"><option value="pct">% of the line</option><option value="flat">₹ off each unit</option></select></div>
    <div><label>Value</label><input id="ofv" type="number" min="0" step="0.01"></div>
    <div><label>From</label><input id="off" type="date" value="${today()}"></div>
    <div><label>To (blank = no end)</label><input id="ofto" type="date"></div></div>
    <div class="row"><button class="b" onclick="saveOffer()">Save offer</button></div></div>`:"";
  return form+`<div class="card"><h2>Offers (${offers.length})</h2><div class="tw"><table><tr><th>Name</th><th>Applies to</th><th>Discount</th><th>From</th><th>To</th><th>Status</th><th></th></tr>
  ${offers.slice().sort((a,b)=>(b.at||0)-(a.at||0)).map(o=>{const [s,k]=offerStatus(o);return `<tr><td>${esc(o.name)}</td><td style="white-space:normal">${esc(targetLabel(o.target))}</td>
    <td>${o.type==="pct"?esc(o.value)+"%":"₹"+esc(o.value)+" per unit"}</td><td>${dfmt(o.from)}</td><td>${o.to?dfmt(o.to):"no end"}</td><td><span class="badge ${k}">${s}</span></td>
    <td>${canEdit()?`<button class="b s" onclick="toggleOffer('${esc(o.id)}',${o.active===false})">${o.active===false?"Turn on":"Turn off"}</button> <button class="b d" onclick="deleteOffer('${esc(o.id)}')">Delete</button>`:""}</td></tr>`}).join("")||`<tr><td colspan="7">No offers yet.</td></tr>`}</table></div></div>`;
}
window.saveOffer=async()=>{
  const name=gv("ofn").trim(),target=gv("oft"),type=gv("ofk")||"pct",value=Number(gv("ofv")),from=gv("off"),to=gv("ofto");
  if(!name)return say("Give the offer a name.",true);
  if(!target)return say("Choose the item or product.",true);
  if(!(value>0))return say("Enter a discount above zero.",true);
  if(type==="pct"&&value>100)return say("A percentage cannot be more than 100.",true);
  if(from&&to&&to<from)return say("The end date is before the start date.",true);
  try{
    await O("offers").add({name,target,type,value,from,to,active:true,createdBy:me.name,at:Date.now()});
    await audit("Created","Offer",name,targetLabel(target)+" · "+(type==="pct"?value+"%":"₹"+value+" per unit")+(from?" · from "+from:"")+(to?" to "+to:""));
    await loadAll();say("Offer saved.");
  }catch(e){err(e)}
};
window.toggleOffer=async(id,on)=>{try{await D("offers/"+id).update({active:on});await audit(on?"Turned on":"Turned off","Offer",(offers.find(x=>x.id===id)||{}).name||id,"");await loadAll();say(on?"Offer on.":"Offer off.")}catch(e){err(e)}};
window.deleteOffer=async id=>{
  if(!confirm("Delete this offer? Bills already made keep their discount."))return;
  try{const o=offers.find(x=>x.id===id)||{};await D("offers/"+id).delete();await audit("Deleted","Offer",o.name||id,"");await loadAll();say("Offer deleted.")}catch(e){err(e)}
};

/* ---------- E-WAY BILL: transport details, download, file for a period ---------- */
function downloadJSON(name,obj){
  const blob=new Blob([JSON.stringify(obj,null,2)],{type:"application/json"}),a=document.createElement("a");
  a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
}
function ewayCard(b){
  const e=b.eway||{},can=canEdit()&&!b.cancelled,dis=can?"":"disabled",probs=ewayProblems(b,company||{});
  const modes=[["1","Road"],["2","Rail"],["3","Air"],["4","Ship"]];
  return `<div class="card noprint"><h2>E-way bill</h2>
  <p class="mut">Needed when the invoice value is above ₹${EWB_THRESHOLD} (state rules can differ). Save the transport details, then download. Upload the file on the GST e-way bill portal (Bulk generation).</p>
  ${probs.length?`<div class="msg e" style="white-space:normal">${probs.map(esc).join("<br>")}</div>`:`<div class="msg">Ready for the e-way bill file.</div>`}
  <div class="g"><div><label>Transport mode</label><select id="ew_mode" ${dis}>${modes.map(([v,t])=>`<option value="${v}" ${(e.transMode||"1")===v?"selected":""}>${t}</option>`).join("")}</select></div>
  <div><label>Vehicle number</label><input id="ew_veh" value="${esc(e.vehicleNo)}" ${dis}></div>
  <div><label>Distance (km)</label><input id="ew_km" type="number" min="0" value="${esc(e.distance)}" ${dis}></div>
  <div><label>Transporter name</label><input id="ew_tn" value="${esc(e.transporterName)}" ${dis}></div>
  <div><label>Transporter ID (GSTIN)</label><input id="ew_ti" value="${esc(e.transporterId)}" ${dis}></div>
  <div><label>Transport doc no. (LR / GR)</label><input id="ew_td" value="${esc(e.transDocNo)}" ${dis}></div>
  <div><label>Ship-to state code (unregistered party)</label><input id="ew_ts" value="${esc(e.toState)}" ${dis}></div></div>
  <div class="row"><button class="b s" onclick="saveEway('${esc(b.id)}')" ${dis}>Save transport details</button><button class="b" onclick="downloadEwayFor('${esc(b.id)}')">Download e-way JSON</button></div>
  <p class="mut">Download uses the saved details, so save first.</p></div>`;
}
window.saveEway=async id=>{
  const eway={transMode:gv("ew_mode")||"1",vehicleNo:gv("ew_veh").trim().toUpperCase(),distance:Number(gv("ew_km"))||0,transporterName:gv("ew_tn").trim(),
    transporterId:gv("ew_ti").trim().toUpperCase(),transDocNo:gv("ew_td").trim(),toState:gv("ew_ts").trim()};
  try{
    const b=bills.find(x=>x.id===id)||{};
    await D("bills/"+id).update({eway});
    await audit("Updated","E-way",b.no||id,(eway.vehicleNo||"no vehicle")+" · "+eway.distance+" km");
    await loadAll();say("Transport details saved.");
  }catch(e){err(e)}
};
window.downloadEwayFor=id=>{
  const b=bills.find(x=>x.id===id);if(!b)return;
  const f=ewayFile([b],company||{});
  if(!f.included)return say("Not ready: "+f.skipped[0].problems.join(" "),true);
  downloadJSON("eway-"+b.no+".json",f.json);
};
window.downloadEwayPeriod=()=>{
  const from=rep.from||today().slice(0,8)+"01",to=rep.to||today();
  const list=bills.filter(b=>!b.cancelled&&inRange(b.date,from,to));
  if(!list.length)return say("No bills in this period.",true);
  const f=ewayFile(list,company||{});
  if(!f.included)return say(`None of the ${list.length} bill(s) is ready. Open each one and fill in the missing details.`,true);
  downloadJSON(`eway-${from}-to-${to}.json`,f.json);
  if(f.skipped.length)say(`${f.included} bill(s) downloaded. Not included: ${f.skipped.map(s=>s.no).join(", ")}. Open them and fill in the missing details.`);
};

/* ---------- PAYABLES: what we owe suppliers ---------- */
function payableCard(p){
  const total=purchaseTotal(p),paid=purchasePaid(p),bal=payableOf(p),can=canCreateCh()&&p.status!=="cancelled"&&bal>0.004;
  return `<div class="card noprint"><h2>Payable to ${esc(p.supplier)}</h2><div class="g">
    <div><label>Total (with GST)</label><b>${fmt(total)}</b></div><div><label>Paid</label><b>${fmt(paid)}</b></div>
    <div><label>Balance payable</label><b class="pay">${fmt(bal)}</b></div></div>
    ${(p.payments||[]).length?`<div class="tw" style="margin-top:8px"><table><tr><th>Date</th><th>Mode</th><th>Reference</th><th>Amount</th></tr>${(p.payments||[]).map(x=>`<tr><td>${dfmt(x.date)}</td><td>${esc(x.mode)}</td><td>${esc(x.ref)}</td><td>${fmt(x.amount)}</td></tr>`).join("")}</table></div>`:""}
    ${can?`<div class="g" style="margin-top:8px"><div><label>Mode</label><select id="sp_m">${PAYMODES.map(m=>`<option>${m}</option>`).join("")}</select></div><div><label>Amount</label><input id="sp_a" type="number" min="0" step="0.01"></div><div><label>UTR / cheque / UPI ref</label><input id="sp_r"></div><div><label>Date</label><input id="sp_d" type="date" value="${today()}"></div></div><div class="row"><button class="b" onclick="addSupplierPay('${esc(p.id)}')">Record payment to supplier</button></div>`:""}
  </div>`;
}
window.addSupplierPay=async id=>{
  const amount=money(gv("sp_a")),mode=gv("sp_m")||"NEFT/RTGS",ref=gv("sp_r").trim(),date=gv("sp_d")||today();
  if(!(amount>0))return say("Enter an amount above zero.",true);
  try{
    await db.runTransaction(async t=>{
      const r=D("purchases/"+id),d=(await t.get(r)).data();
      if(!d)throw new Error("Purchase not found.");
      if(d.status==="cancelled")throw new Error("This purchase is cancelled.");
      const bal=payableOf(d);
      if(amount>bal+0.005)throw new Error(`Amount is more than the balance payable of ${fmt(bal)}.`);
      const payments=[...(d.payments||[]),{mode,amount,ref,date,by:me.name,at:Date.now()}];
      t.update(r,{payments,log:[...(d.log||[]),{t:"Paid supplier "+mode+" "+fmt(amount),by:me.name,at:Date.now()}]});
      t.set(O("audit").doc(),auditRec("Supplier payment","Purchase",d.no,mode+" "+fmt(amount)+(ref?" · "+ref:"")));
    });
    await loadAll();say("Supplier payment recorded.");
  }catch(e){err(e)}
};

window.exportRep=k=>{
  const d=repData();
  const m={
    sales:["sales-summary.csv",["Bills","Taxable","Tax","Total","Paid","Balance"],[[d.sales.count,d.sales.taxable,d.sales.tax,d.sales.total,d.sales.paid,d.sales.balance]]],
    recv:["receivables.csv",["Party","Billed","Paid","Balance"],d.recv.map(r=>[r.party,r.billed,r.paid,r.balance])],
    pay:["payables.csv",["Supplier","Billed (with GST)","Paid","Balance"],d.pay.map(r=>[r.supplier,r.billed,r.paid,r.balance])],
    stock:["stock-value.csv",["Warehouse","Item code","Item","Qty","Rate","Value"],d.stockRows.map(r=>[r.wh,r.item,r.name,r.qty,r.rate,r.value])],
    pend:["pending-challans.csv",["Challan","Date","Party","Pending qty"],d.pend.map(r=>[r.no,r.date,r.party,r.pending])],
    exc:["exceptions.csv",["Kind","Ref","Date","Type","Reason","By","Approver","At"],d.exc.map(r=>[r.kind,r.ref,r.date,r.type,r.reason,r.by,r.approver,r.at?new Date(r.at).toLocaleString():""])],
    purch:["purchases.csv",["Orders","Ordered value","Received value"],[[d.purch.count,d.purch.ordered,d.purch.received]]]
  };
  const [name,head,rows]=m[k];
  const blob=new Blob([toCSV(head,rows)],{type:"text/csv"}),a=document.createElement("a");
  a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
};
function reportsView(){
  const d=repData();
  const sec=(title,cls,key,body)=>`<div class="card"><div class="row" style="margin:0 0 8px;justify-content:space-between"><h2 class="${cls}" style="margin:0">${title}</h2><button class="b s" onclick="exportRep('${key}')">Download CSV</button></div>${body}</div>`;
  const tbl=(head,rows)=>`<div class="tw"><table><tr>${head.map(h=>`<th>${h}</th>`).join("")}</tr>${rows.join("")||`<tr><td colspan="${head.length}">Nothing to show.</td></tr>`}</table></div>`;
  const tile=(label,val,cls)=>`<div style="flex:1;min-width:150px"><div class="mut">${label}</div><div class="${cls}" style="font-size:22px;font-weight:700">${val}</div></div>`;
  const recvTotal=money(d.recv.reduce((a,r)=>a+r.balance,0)),payTotal=money(d.pay.reduce((a,r)=>a+r.balance,0));
  let out=`<div class="card"><h2>Period</h2><div class="g"><div><label>From</label><input id="rf" type="date" value="${esc(d.from)}"></div><div><label>To</label><input id="rt" type="date" value="${esc(d.to)}"></div></div><div class="row"><button class="b" onclick="repApply()">Apply</button></div></div>`;
  out+=`<div class="card"><div class="row" style="margin:0;gap:24px">${tile("Receivable (customers owe you)",fmt(recvTotal),"recv")}${tile("Payable (you owe suppliers)",fmt(payTotal),"pay")}${tile("Net",fmt(money(recvTotal-payTotal)),"")}</div></div>`;
  if(has("billing")){
    out+=sec("Sales (bills in period)","","sales",tbl(["Bills","Taxable","Tax","Total","Paid","Balance"],[`<tr><td>${d.sales.count}</td><td>${fmt(d.sales.taxable)}</td><td>${fmt(d.sales.tax)}</td><td>${fmt(d.sales.total)}</td><td>${fmt(d.sales.paid)}</td><td class="recv">${fmt(d.sales.balance)}</td></tr>`]));
    out+=sec("Receivables – customers who owe you","recv","recv",tbl(["Party","Billed","Paid","Balance"],d.recv.map(r=>`<tr><td>${esc(r.party)}</td><td>${fmt(r.billed)}</td><td>${fmt(r.paid)}</td><td class="recv"><b>${fmt(r.balance)}</b></td></tr>`)));
  }
  if(has("purchase")){
    out+=sec("Payables – suppliers you owe","pay","pay",tbl(["Supplier","Billed (with GST)","Paid","Balance"],d.pay.map(r=>`<tr><td>${esc(r.supplier)}</td><td>${fmt(r.billed)}</td><td>${fmt(r.paid)}</td><td class="pay"><b>${fmt(r.balance)}</b></td></tr>`)));
    out+=sec("Purchases in period","","purch",tbl(["Orders","Ordered value","Received value"],[`<tr><td>${d.purch.count}</td><td>${fmt(d.purch.ordered)}</td><td>${fmt(d.purch.received)}</td></tr>`]));
  }
  if(has("inventory")){
    out+=sec("Stock value","","stock",tbl(["Warehouse","Item","Qty","Rate","Value"],d.stockRows.map(r=>`<tr><td>${esc(r.wh)}</td><td>${esc(r.item+" – "+r.name)}</td><td>${r.qty}</td><td>${fmt(r.rate)}</td><td>${fmt(r.value)}</td></tr>`)));
  }
  if(has("sales")){
    out+=sec("Challans with quantity still to bill","","pend",tbl(["Challan","Date","Party","Pending qty"],d.pend.map(r=>`<tr><td>${esc(r.no)}</td><td>${dfmt(r.date)}</td><td>${esc(r.party)}</td><td>${r.pending}</td></tr>`)));
  }
  out+=sec("Exceptions (all approvals, newest first)","","exc",tbl(["When","Kind","Ref","Type","Reason","By","Approved by"],d.exc.map(r=>`<tr><td>${r.at?new Date(r.at).toLocaleString():""}</td><td>${esc(r.kind)}</td><td>${esc(r.ref)}</td><td>${esc(r.type)}</td><td style="white-space:normal">${esc(r.reason)}</td><td>${esc(r.by)}</td><td>${esc(r.approver)}</td></tr>`)));
  return out;
}

let auditRows=[],auditFilter={entity:"",who:""};

  try{const s=await O("audit").orderBy("at","desc").limit(300).get();auditRows=s.docs.map(d=>({id:d.id,...d.data()}))}

  <div class="row"><button class="b" onclick="createOrg()">Create organisation</button></div></div>
  ${orgsList.map(o=>`<div class="card"><h2>${esc(o.name)} ${o.active===false?"<span class='badge x'>Suspended</span>":"<span class='badge ok'>Active</span>"}</h2>
  <div class="mods">${Object.keys(MODS).map(k=>modBox(o,k)).join("")}</div>
  <div class="g" style="margin-top:8px"><div><label>Valid until (blank = no expiry)</label><input type="date" value="${ymd(o.validUntil)}" onchange="setValid('${o.id}',this.value)"></div></div>
  <div class="g" style="margin-top:8px"><div><label>Web page name</label><input id="wn_${o.id}" value="${esc(o.appName||o.name)}"></div></div>
  <div class="row"><button class="b s" onclick="setAppName('${o.id}')">Save web page name</button></div>
  <div class="row"><button class="b" onclick="enterOrg('${o.id}')">Open</button><button class="b s" onclick="setAll('${o.id}',true)">Enable all</button><button class="b s" onclick="setAll('${o.id}',false)">Disable all</button>
  <button class="b ${o.active===false?"":"d"}" onclick="setActive('${o.id}',${o.active===false})">${o.active===false?"Reactivate":"Suspend organisation"}</button></div></div>`).join("")||`<div class="card mut">No organisations yet.</div>`}
  <div class="card"><h2>Import data from the old single-company version</h2><p class="mut">Copies items, warehouses, stock, products, challans, company details, counters and users into one organisation. Safe to re-run. Skip this if you are starting fresh.</p>
  <div class="row"><select id="mg" style="max-width:260px">${opts(orgsList,o=>o.name)}</select><button class="b" onclick="migrate()">Import</button></div></div>`;
}
window.createOrg=async()=>{
  const name=gv("on").trim(),an=gv("oan").trim(),ae=gv("oae").trim(),ap=gv("oap");
  if(!name||!an||!ae||ap.length<6)return say("Enter organisation name, admin name, email and a 6+ character password.",true);
  const modules=fullMods(Object.keys(MODS).filter(k=>$("#nm_"+k)&&$("#nm_"+k).checked));
  let sec;
  try{
    sec=firebase.initializeApp(CFG,"sec"+Date.now());
    const c=await sec.auth().createUserWithEmailAndPassword(ae,ap);await sec.auth().signOut();
    const ref=db.collection("orgs").doc(),b=db.batch();
    b.set(ref,{name,appName:gv("oweb").trim()||name,active:true,modules,validUntil:0,createdAt:Date.now()});
    b.set(db.doc("orgs/"+ref.id+"/users/"+c.user.uid),{name:an,email:ae,role:"admin"});
    b.set(db.doc("userOrg/"+c.user.uid),{orgId:ref.id});
    await b.commit();await auditTo(ref.id,"Created","Organisation",name,"admin "+ae+" · modules: "+Object.keys(modules).filter(k=>modules[k]).join(", "));await loadOrgs();say(`${name} created. Give ${ae} the temporary password.`);
  }catch(e){err(e)}finally{if(sec)sec.delete()}
};
const orgUpd=async(id,d,msg)=>{try{await db.doc("orgs/"+id).update(d);await auditTo(id,"Updated","Organisation",(orgsList.find(x=>x.id===id)||{}).name||id,msg);await loadOrgs();say(msg)}catch(e){err(e)}};
window.toggleMod=(id,k,on)=>{
  const m={...(orgsList.find(x=>x.id===id).modules||{})};
  (on?reqAll(k):depsOf(k)).forEach(x=>m[x]=on);
  orgUpd(id,{modules:m},on?`${MODS[k].label} enabled (with anything it needs).`:`${MODS[k].label} disabled (with anything that depends on it).`);
};
window.setAll=(id,on)=>orgUpd(id,{modules:Object.fromEntries(Object.keys(MODS).map(k=>[k,on]))},on?"All modules enabled.":"All modules disabled.");
window.setActive=(id,on)=>orgUpd(id,{active:on},on?"Organisation reactivated.":"Organisation suspended: its users are locked out.");
window.setValid=(id,v)=>orgUpd(id,{validUntil:v?new Date(v+"T23:59:59").getTime():0},v?"Expiry saved.":"Expiry cleared.");
window.enterOrg=async id=>{
  try{orgId=id;me.role="admin";tab="";await loadAll();draw();window.scrollTo(0,0)}catch(e){orgId=null;org=null;me.role="super";tab="orgs";err(e)}
};
window.leaveOrg=async()=>{orgId=null;org=null;me.role="super";resetData();tab="orgs";await loadOrgs();draw()};
window.migrate=async()=>{
  const oid=gv("mg");if(!oid)return say("Create an organisation first.",true);
  if(!confirm("Import the old data into this organisation?"))return;
  const base=p=>db.doc("orgs/"+oid+"/"+p),W=[],n={};
  try{
    for(const c of ["items","warehouses","stock","products","challans"]){const s=await db.collection(c).get();n[c]=s.size;s.forEach(d=>W.push([base(c+"/"+d.id),d.data()]))}
    const co=await db.doc("settings/company").get();if(co.exists)W.push([base("settings/company"),co.data()]);
    const ct=await db.doc("meta/counters").get();if(ct.exists)W.push([base("counters/main"),ct.data()]);
    const us=await db.collection("users").get();n.users=0;
    us.forEach(d=>{if(d.id===me.uid)return;const u=d.data();n.users++;W.push([base("users/"+d.id),{name:u.name||"",email:u.email||"",role:u.role}]);W.push([db.doc("userOrg/"+d.id),{orgId:oid}])});
    for(let i=0;i<W.length;i+=400){const b=db.batch();W.slice(i,i+400).forEach(([r,d])=>b.set(r,d));await b.commit()}
    await auditTo(oid,"Imported","Legacy data",oid,"single-company data copied");say("Imported: "+Object.entries(n).map(([k,v])=>v+" "+k).join(", ")+".");
  }catch(e){err(e)}
};

if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(e=>console.warn("offline app shell unavailable",e)));
</script></body></html>
